# Git hooks, installed by `bun install` (package.json's prepare). CI checks the pull request title
# and body with the same scripts, since they become the commit on main.
commit-msg:
  commands:
    subject:
      run: bun run scripts/check-subject.ts {1}
    mentions:
      run: bun run scripts/check-mentions.ts {1}
