# Whose each file is and under what license, for the files that can't say it in their own SPDX
# lines (pictures, JSON, SQL, Markdown, lockfiles, fixtures) and for other people's files. A file's
# own lines win over this; where two entries below match a file, the later one wins.
# `reuse lint` checks that every file is covered. LICENSING.md says the same in words.
version = 1

# The code: everything not named below.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Cubepals Authors"
SPDX-License-Identifier = "AGPL-3.0-only"

# The brand and the site: all rights reserved (brand/LICENSE.md). The guides' words and the
# landing page's code carry this in their own SPDX lines.
[[annotations]]
path = [
  "brand/**",
  "apps/web/src/landing/**",
  "apps/web/public/imagery/**",
  "apps/web/public/guides/**",
  "apps/web/public/email/*.png",
  "apps/web/public/email/*.gif",
  "apps/web/public/logo.png",
  "apps/web/public/server-icons/blockly.svg",
  "apps/control/assets/server-icons/blockly.png",
  "apps/web/src/app/icon.svg",
  "apps/web/src/app/apple-icon.png",
  "apps/web/src/app/opengraph-image.png",
  "apps/web/src/app/opengraph-image.alt.txt",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Cubepals Authors"
SPDX-License-Identifier = "LicenseRef-Cubepals-Reserved"

# The landing page's pixel typeface.
[[annotations]]
path = "apps/web/src/landing/type/**"
precedence = "closest"
SPDX-FileCopyrightText = "2012 The Press Start 2P Project Authors (cody@zone38.net)"
SPDX-License-Identifier = "OFL-1.1"

# The architecture document's typeface, and the PDF that embeds it.
[[annotations]]
path = "docs/architecture/fonts/**"
precedence = "closest"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "docs/architecture/Blockly-Architecture.pdf"
precedence = "closest"
SPDX-FileCopyrightText = ["2026 The Cubepals Authors", "2017 IBM Corp."]
SPDX-License-Identifier = "AGPL-3.0-only AND OFL-1.1"

# blocklyd's files, copied from the release this repository pins (scripts/blocklyd.ts), and the
# types generated from them.
[[annotations]]
path = [
  "apps/control/src/infra/fleet/node-reads.openapi.json",
  "apps/control/src/infra/fleet/node-writes.openapi.json",
  "apps/control/src/infra/fleet/daemon.json",
  "apps/control/src/infra/fleet/generated/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Cubepals Authors"
SPDX-License-Identifier = "FSL-1.1-ALv2"

# Other APIs' descriptions, fetched by tools/openapi, and the types generated from them.
[[annotations]]
path = ["apps/control/src/infra/fly/machines.openapi.json", "apps/control/src/infra/fly/generated/**"]
precedence = "closest"
SPDX-FileCopyrightText = "Fly.io, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["apps/control/src/infra/hangar/hangar.openapi.json", "apps/control/src/infra/hangar/generated/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2020-2023 HangarMC and Contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["apps/control/src/infra/modrinth/labrinth.openapi.json", "apps/control/src/infra/modrinth/generated/**"]
precedence = "closest"
SPDX-FileCopyrightText = "Rinth, Inc."
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["apps/control/src/infra/boat/boat.openapi.json", "apps/control/src/infra/boat/generated/**"]
precedence = "closest"
SPDX-FileCopyrightText = "The Boat authors (docs.boat.dev)"
SPDX-License-Identifier = "LicenseRef-Upstream-Terms"

# Hangar's answers, recorded for tests: the projects' text is their authors'.
[[annotations]]
path = "apps/control/src/infra/hangar/fixtures/**"
precedence = "closest"
SPDX-FileCopyrightText = ["HangarMC and Contributors", "The authors of the projects they describe"]
SPDX-License-Identifier = "LicenseRef-Upstream-Terms"

# AOneBlock's settings as it writes them, with one change (templates.ts).
[[annotations]]
path = "apps/control/src/app/setups/aoneblock-config.yml"
precedence = "closest"
SPDX-FileCopyrightText = ["The AOneBlock authors (BentoBoxWorld)", "2026 The Cubepals Authors"]
SPDX-License-Identifier = "EPL-2.0"

# BSkyBlock's settings as it writes them, with one change (templates.ts).
