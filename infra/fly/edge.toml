# The edge (§12): mc-router and Geyser, supervised by the edge agent, bly-<deployment>-edge. Java
# players join <slug>.<play domain>:25565, and Bedrock players the same name on UDP 19132, whose
# wildcard A/AAAA records point at this app's addresses.
# Deploy from the repository root:
#   fly deploy . --config infra/fly/edge.toml --dockerfile apps/edge/Dockerfile --app bly-<deployment>-edge
# CONTROL_URL (the control app's internal listener, http://api.process.bly-<deployment>-control.internal:4001),
# EDGE_TOKEN, FLOODGATE_KEY (the key Geyser shares with every Paper server), and
# WEB_CANONICAL_ORIGIN and PLAY_DOMAINS (where a browser's play address goes) are Fly secrets set
# by Terraform (infra/terraform/modules/edge).

app = "bly-staging-edge"
primary_region = "fra"

[build]
  dockerfile = "../../apps/edge/Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  MINECRAFT_PORT = "25565"
  IDLE_HINT_AFTER = "10m"
  # Fly's proxy opens each connection with a PROXY line naming the player's address, which the
  # agent's per-address limits count by (apps/edge/front.ts).
  PROXY_PROTOCOL = "1"
  # Geyser's heap, beside the agent and mc-router (about 100 MB together) on this machine's 2 GB:
  # with 20 Bedrock players Geyser's process held about 630 MB and the whole machine about 900 MB,
  # which leaves room for the heap to grow, the operating system and the game's files Geyser loads.
  GEYSER_HEAP = "768m"
  # Scraped by Fly's managed Prometheus below; no service names the port, so it is not published.
  METRICS_LISTEN = "0.0.0.0:9091"

# Raw TCP: the Minecraft handshake names the server, so nothing in front may touch the stream
# beyond the PROXY line ahead of it.
[[services]]
  protocol = "tcp"
  internal_port = 25565
  auto_stop_machines = "off"
  auto_start_machines = false

  # Counted in connections, since a player holds one for as long as they play. On this machine
  # the CPU runs out long before memory: with the agent's front door and mc-router each copying
  # every packet, a player sending and receiving 20 a second costs about 0.2% of the CPU, and about
  # 75 KB (30 KB in the agent, 35 in mc-router, 10 in the kernel's buffers), so 400 players need
  # about 30 MB beyond the edge's own 60. A shared CPU runs at that rate only while its burst
  # lasts: on staging, an edge carried 400 players with replies in under 80 ms, then after a few
  # minutes above its baseline it was held to that baseline, about 50 players' worth, and replies
  # took up to a second and connections dropped.
  # Past the soft limit, Fly's proxy sends new connections to another edge still under its own, so
  # players beyond what one edge keeps up with go to the next nearest instead of slowing everyone
  # on this one. With a single edge it changes nothing. The hard limit is where even a full burst
  # is used up: new connections wait at the proxy rather than slow every player already in.
  [services.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 400

  [[services.ports]]
    port = 25565
    handlers = ["proxy_proto"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "15s"

# Bedrock players (apps/edge/bedrock.ts). UDP reaches a machine only on a dedicated IPv4, at a
# socket bound to fly-global-services, and Fly never starts a stopped machine for it: this is why
# Geyser runs here, on the machine that is always up, and wakes a sleeping server through the Java
# path. Fly doesn't rewrite UDP ports, so the internal and external ones are the same.
[[services]]
  protocol = "udp"
  internal_port = 19132
  auto_stop_machines = "off"
  auto_start_machines = false

  [[services.ports]]
    port = 19132

# A play address opened in a browser (apps/edge/browser-redirect.ts): the wildcard records send it
# here too, and without this it would hang until the browser gave up. Fly's proxy speaks HTTP, and
# on 443 ends TLS with the app's certificate for *.<play domain> (Terraform's fly_cert, issued over
# a DNS-01 _acme-challenge CNAME), so the agent sees plain HTTP/1.1 with the Host the browser sent.
# Its own service, so its limits are its own and never count against the Minecraft one's.
[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "off"
  auto_start_machines = false

  # Counted in requests, each a redirect written at once. Past the hard limit a browser waits at
  # the proxy rather than take the CPU the players on this machine need.
  [services.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "15s"

  # The edge's own health (the agent's /_health), which covers Java players alone: Geyser failing
  # must never take the machine out of rotation for them. Geyser restarts by itself, and how it
  # stands is its own status at /_health/bedrock, which no check asks.
  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "15s"
    method = "get"
    path = "/_health"

# The agent's drain status (apps/edge/drain.ts, port 8091) has no service here on purpose: a deploy asks
# for it over Fly's private network, and nothing on the internet can.

[metrics]
  port = 9091
  path = "/metrics"

# Sized by measuring 20 Bedrock players beside Java joins for ten minutes (apps/edge/bedrock.ts): a
# shared CPU of two held back nearly all of its time once its burst was spent, and Java joins took
# twice as long. Four shared CPUs and 2 GB kept up with no wait added to them.
[[vm]]
  size = "shared-cpu-4x"
  memory = "2048mb"
