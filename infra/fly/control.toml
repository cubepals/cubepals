# The control plane's api and worker roles: one Fly app per environment, bly-<deployment>-control.
# Deploy from the repository root:
#   fly deploy . --config infra/fly/control.toml --dockerfile apps/control/Dockerfile --app bly-<deployment>-control
# Every deployment value (DeploymentConfig) is a Fly secret that Terraform sets
# (infra/terraform/modules/control); this file holds only what is the same in every environment.
# The realtime role runs from the same image in its own app (realtime.toml): see its header.

app = "bly-staging-control"
primary_region = "fra"
# A deploy stops each machine with this signal and waits this long before killing it. The worker
# lets the operations it runs finish for a minute first (DRAIN_MS in src/main.node.ts), then hands
# back the rest; Fly's default of five seconds killed it mid-step, and its operations then waited
# out their half-hour deadline.
kill_signal = "SIGTERM"
kill_timeout = 90

[build]
  dockerfile = "../../apps/control/Dockerfile"

[deploy]
  # Migrations run once per release, before any machine takes the new image.
  release_command = "node ../../packages/db/src/migrate.ts"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  API_LISTEN = "0.0.0.0:8080"
  # The edge reaches the internal listener over the organization's private network only.
  INTERNAL_LISTEN = "fly-local-6pn:4001"

[processes]
  api = "env ROLES=api node src/main.node.ts"
  worker = "env ROLES=worker node src/main.node.ts"

# The web app's /api rewrite and game runtimes' artifact downloads arrive here.
[http_service]
  processes = ["api"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Only that the api answers: `/api/health` also judges the worker's sweeps, and a worker that is
  # down must not take the api out of routing. A scheduled workflow polls that one (health.yml).
  [[http_service.checks]]
    method = "GET"
    path = "/api/health/live"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# The worker serves nothing but its own health, on API_LISTEN's port (src/interfaces/http/
# worker-health.ts): it fails once the worker's scheduled passes stop being recorded.
[checks.worker]
  type = "http"
  processes = ["worker"]
  port = 8080
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "2m"

[[vm]]
  processes = ["api"]
  size = "shared-cpu-2x"
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "1gb"
