# Temporary: probes the staging edge's RakNet port from a runner, which can send UDP. Removed
# before this branch's pull request.
name: Bedrock probe

on:
  push:
    branches: [claude/eager-goodall-atvoh9]
    paths: [.github/workflows/bedrock-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDGE: 37.16.28.151
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        working-directory: tools/bedrock-join
      - name: Capture
        run: |
          sudo tcpdump -i any -nn -U -w probe.pcap "host $EDGE or icmp" > /dev/null 2>&1 &
          sleep 2
      # The edge's Xbox sign-in check is on: a headless client that reaches Geyser is turned away
      # with a reason, which shows RakNet connected. One that never connects times out.
      - name: Join through the forwarder
        working-directory: tools/bedrock-join
        run: |
          for try in 1 2 3; do
            timeout 120 bun join.ts --address probe.play.staging.cubepals.com --timeout 60 --hold 1 || true
          done
      - name: Join with the cap lifted (control)
        working-directory: tools/bedrock-join
        run: timeout 120 bun join.ts --address probe.play.staging.cubepals.com --mtu 1500 --timeout 40 --hold 1 || true
      - name: What went over the wire
        if: always()
        run: |
          sudo pkill tcpdump || true
          sleep 1
          sudo tcpdump -nn -r probe.pcap 2>/dev/null | head -2000
