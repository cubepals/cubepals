# Temporary: probes the staging edge's RakNet port from a runner, which can send UDP. Removed
# before this branch's pull request.
name: Bedrock probe

on:
  push:
    branches: [claude/eager-goodall-atvoh9]
    paths: [.github/workflows/bedrock-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDGE: 37.16.28.151
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        working-directory: tools/bedrock-join
      - name: Capture
        run: |
          sudo tcpdump -i any -nn -U -w probe.pcap "host $EDGE or icmp" > /dev/null 2>&1 &
          sleep 2
      - name: Probe
        shell: python3 {0}
        run: |
          import json, os, select, socket, struct, time
          HOST, PORT = os.environ['EDGE'], 19132
          MAGIC = bytes.fromhex('00ffff00fefefefefdfdfdfd12345678')
          IP_MTU_DISCOVER, DONT, DO = 10, 0, 2
          T0 = time.time()
          def say(**fields):
              print(json.dumps({'t': round(time.time() - T0, 1), **fields}), flush=True)
          def ping():
              return b'\x01' + struct.pack('>q', int(time.time() * 1000)) + MAGIC + os.urandom(8)
          def ocr1(mtu, pad='zero'):
              body = b'\x05' + MAGIC + bytes([11])
              n = mtu - 28 - len(body)
              return body + (os.urandom(n) if pad == 'random' else b'\x00' * n)
          def sock(df):
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.setsockopt(socket.IPPROTO_IP, IP_MTU_DISCOVER, DO if df else DONT)
              s.bind(('0.0.0.0', 0))
              return s
          def drain(s, wait):
              got, end = [], time.time() + wait
              while (left := end - time.time()) > 0:
                  if not select.select([s], [], [], left)[0]:
                      break
                  data, _ = s.recvfrom(4096)
                  got.append(hex(data[0]))
              return got
          def single(label, payload, df=False, wait=2.0):
              s = sock(df)
              s.sendto(payload, (HOST, PORT))
              say(phase=label, bytes=len(payload), df=df, port=s.getsockname()[1], replies=drain(s, wait))
              s.close()
          def raknet_like(label, sizes, pad='zero', df=True):
              # One socket, open requests half a second apart, as RakNet's client sends them.
              s = sock(df)
              sent = []
              for mtu in sizes:
                  try:
                      s.sendto(ocr1(mtu, pad), (HOST, PORT))
                      sent.append(mtu)
                  except OSError as e:
                      sent.append(f'{mtu}:{e.errno}')
                  time.sleep(0.5)
              say(phase=label, pad=pad, df=df, port=s.getsockname()[1], sent=sent, replies=drain(s, 1.0))
              s.close()
          def canaries(label, seconds, every=5):
              end = time.time() + seconds
              while time.time() < end:
                  single(label + ':canary-1172', ocr1(1200), wait=1.5)
                  single(label + ':canary-ping', ping(), wait=1.0)
                  time.sleep(max(0, every - 2.5))
          RAKNET = [1492] * 4 + [1200] * 4 + [576] * 4
          while time.time() - T0 < 180:
              s = sock(False); s.sendto(ping(), (HOST, PORT))
              if drain(s, 2.0):
                  break
              time.sleep(3)
          say(phase='edge answers')
          # A: gentle, one open per new socket every 3 s.
          for _ in range(6):
              single('A:gentle-1172', ocr1(1200)); time.sleep(1)
          # B: RakNet's way, without the 1492 opens that never fit Fly's path.
          raknet_like('B:raknet-no1492', [1200] * 4 + [576] * 4)
          canaries('after-B', 30)
          # C: RakNet's way exactly, padded with zeros.
          raknet_like('C:raknet-zero', RAKNET)
          canaries('after-C', 60)
          # D: RakNet's way, padded with random bytes.
          raknet_like('D:raknet-random', RAKNET, pad='random')
          canaries('after-D', 60)
          # E: 1492 opens alone, then canaries.
          for _ in range(4):
              single('E:1492-only', ocr1(1492), df=True, wait=0.5)
          canaries('after-E', 90)
      - name: What went over the wire
        if: always()
        run: |
          sudo pkill tcpdump || true
          sleep 1
          sudo tcpdump -nn -r probe.pcap 2>/dev/null | head -2000
