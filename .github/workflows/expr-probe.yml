name: Expr probe
on:
  push:
    branches: [claude/expr-probe]
permissions: {}
jobs:
  top:
    if: github.event_name == 'never'
    runs-on: ubuntu-latest
    steps:
      - run: echo top
  mid:
    needs: top
    if: '!cancelled()'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.s.outputs.go }}
    steps:
      - id: s
        run: echo "go=true" >> "$GITHUB_OUTPUT"
  plain:
    needs: mid
    if: needs.mid.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo plain ran
  explicit:
    needs: mid
    if: >-
      !cancelled()
      && needs.mid.result == 'success'
      && needs.mid.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo explicit ran
