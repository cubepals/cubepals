name: Expr probe
on:
  push:
    branches: [claude/expr-probe]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      a: ${{ !(contains(fromJSON('["synchronize", "opened", "reopened"]'), fromJSON('{}').action) && fromJSON('{}').draft) }}
      b: ${{ contains(fromJSON('["synchronize", "opened", "reopened"]'), fromJSON('{}').action) }}
      c: ${{ !(false && fromJSON('{}').draft) }}
      d: ${{ !(contains(fromJSON('["synchronize", "opened", "reopened"]'), github.event.action) && github.event.pull_request.draft) }}
    steps:
      - run: |
          echo "a=${{ !(contains(fromJSON('["synchronize", "opened", "reopened"]'), fromJSON('{}').action) && fromJSON('{}').draft) }}"
          echo "b=${{ contains(fromJSON('["synchronize", "opened", "reopened"]'), fromJSON('{}').action) }}"
          echo "d=${{ !(contains(fromJSON('["synchronize", "opened", "reopened"]'), github.event.action) && github.event.pull_request.draft) }}"
  read:
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "outputs a=[${{ needs.probe.outputs.a }}] b=[${{ needs.probe.outputs.b }}] c=[${{ needs.probe.outputs.c }}] d=[${{ needs.probe.outputs.d }}]"
          echo "cmp=${{ needs.probe.outputs.d == 'true' }}"
