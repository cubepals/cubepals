name: Fleet

# The fleet runtime against the blocklyd this control plane pins (apps/control/Dockerfile,
# scripts/blocklyd.ts). blocklyd itself is cubepals/blocklyd, whose own CI runs this same e2e from
# this repository's main against every change it makes. The paths are the pin, the fleet adapter,
# and what the e2e runs beyond it: @blockly/db, the runtime port, its test database, the S3 store,
# and the control plane's package.json, which pins @peculiar/x509 (the fleet CA's certificates).
# CI owns the affected-path decision and requires this reusable workflow before its aggregate passes.
on:
  workflow_call:
  # Weekly, and on demand.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pin:
    name: blocklyd pin matches its release
    # The image's digest and the copies beside the fleet adapter are the pinned release's.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun scripts/blocklyd.ts check

  fleet-e2e:
    name: Fleet end to end against blocklyd
    # The control plane's fleet runtime against the pinned blocklyd, for real: enrollment over
    # mutual TLS, placement, snapshots, restores, a daemon killed and back, a node held lost, a
    # self-upgrade, and movement between two Docker-in-Docker nodes. The one-node fixture uses
    # debug, since only debug builds take BLOCKLYD_TEST_VERSION. The two-node fixture needs the
    # static binary served in production, extracted from the existing immutable image pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: blockly
          POSTGRES_PASSWORD: blockly
          POSTGRES_DB: blockly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blockly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://blockly:blockly@127.0.0.1:5432/blockly
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      # blocklyd hands data directories to the workloads' user, so it runs as root.
      BLOCKLYD_SUDO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: The pinned version
        id: pin
        run: |
          echo "version=$(bun scripts/blocklyd.ts version)" >> "$GITHUB_OUTPUT"
          blocklyd_image=$(awk '$1 == "FROM" && $3 == "AS" && $4 == "blocklyd" { print $2 }' apps/control/Dockerfile)
          [[ "$blocklyd_image" =~ ^ghcr\.io/cubepals/blocklyd:[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s\n' "$blocklyd_image" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cubepals/blocklyd
          ref: v${{ steps.pin.outputs.version }}
          path: .blocklyd
          persist-credentials: false
      # The Rust the release builds with: rustup installs what its rust-toolchain.toml names.
      - name: Rust from the release's rust-toolchain.toml
        id: rust
        working-directory: .blocklyd
        run: |
          rustup toolchain install
          echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # Keyed on the toolchain and the release: a release's tag never moves, so its build is cached
      # for good, and the next one starts from it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            .blocklyd/target
          key: blocklyd-e2e-${{ steps.rust.outputs.version }}-${{ steps.pin.outputs.version }}
          restore-keys: blocklyd-e2e-${{ steps.rust.outputs.version }}-
      - run: cargo build --locked
        working-directory: .blocklyd
      # Mirrors refuse bursts when parallel jobs pull at once, so each pull retries.
      - name: Pull the test images
        env:
          BLOCKLYD_IMAGE: ${{ steps.pin.outputs.image }}
        run: |
          for image in ghcr.io/rustfs/rustfs:1.0.0 mirror.gcr.io/library/alpine:3.22 mirror.gcr.io/library/docker:29-dind "$BLOCKLYD_IMAGE"; do
            for wait in 2 5 10 20 40 0; do
              docker pull -q "$image" && break
              [ "$wait" = 0 ] && exit 1
              sleep "$wait"
            done
          done
          docker tag mirror.gcr.io/library/alpine:3.22 alpine:3.22
          docker tag mirror.gcr.io/library/docker:29-dind docker:29-dind
      - name: Extract the production static blocklyd
        env:
          BLOCKLYD_IMAGE: ${{ steps.pin.outputs.image }}
        run: |
          mkdir -p .blocklyd/static coverage/fleet
          blocklyd_container=$(docker create "$BLOCKLYD_IMAGE")
          trap 'docker rm -f "$blocklyd_container" >/dev/null' EXIT
          docker cp "$blocklyd_container:/blocklyd" .blocklyd/static/blocklyd
          chmod +x .blocklyd/static/blocklyd
          test -x .blocklyd/static/blocklyd
      - name: Start an S3 store
        run: >-
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=blockly-test
          -e RUSTFS_SECRET_KEY=blockly-test-secret ghcr.io/rustfs/rustfs:1.0.0 /data
      # The node endpoint runs on Node, as in production.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Install application and evidence tooling
        id: tools
        run: |
          for wait in 5 15 30 60 0; do
            bun install --frozen-lockfile && break
            [ "$wait" = 0 ] && exit 1
            sleep "$wait"
          done
          bun run quality:install
      - name: One-node runtime and self-upgrade contracts
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: >-
          bun test ./apps/control/src/infra/fleet/fleet-runtime.e2e.test.ts
          --reporter=junit --reporter-outfile=coverage/fleet/one-node.xml
        env:
          BLOCKLYD_BIN: ${{ github.workspace }}/.blocklyd/target/debug/blocklyd
      - name: Two-node placement, migration and recovery contracts
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          BLOCKLYD_STATIC_BIN: ${{ github.workspace }}/.blocklyd/static/blocklyd
          S3_TEST_CONTAINER: s3
        run: |
          bun_path=$(command -v bun)
          [[ "$bun_path" = /* && -x "$bun_path" ]]
          sudo -n env -i PATH="$PATH" CI="$CI" DATABASE_URL="$DATABASE_URL" \
            S3_TEST_ENDPOINT="$S3_TEST_ENDPOINT" S3_TEST_CONTAINER="$S3_TEST_CONTAINER" \
            BLOCKLYD_STATIC_BIN="$BLOCKLYD_STATIC_BIN" \
            "$bun_path" test ./apps/control/src/infra/fleet/fleet-two-node.e2e.test.ts \
            --reporter=junit --reporter-outfile=coverage/fleet/two-node.xml
      - name: Require both live reports without skips or failures
        if: always()
        run: >-
          node scripts/quality/fleet-evidence.mjs coverage/fleet/one-node.xml
          coverage/fleet/two-node.xml > coverage/fleet/summary.json
      - name: Keep live fleet evidence even when a fixture fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-live-evidence
          path: coverage/fleet/
          if-no-files-found: error
          retention-days: 14
