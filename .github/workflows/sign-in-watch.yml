name: Sign-in watch

# Signs in and signs up through cubepals.com once an hour (scripts/auth-watch.ts). No secrets.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-in-watch
  cancel-in-progress: true

jobs:
  watch:
    name: Sign-in and sign-up work on cubepals.com
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun scripts/auth-watch.ts https://cubepals.com
