name: Sign-in watch

# Every way of signing in and signing up, asked through cubepals.com every 15 minutes
# (scripts/auth-watch.ts). Sign-in is the way in, so a break fails this run even when nothing was
# deployed, and a failed scheduled run is what GitHub sends mail about. No secrets: it asks what any
# browser could, and makes no account.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-in-watch
  cancel-in-progress: true

jobs:
  watch:
    name: Sign-in and sign-up work on cubepals.com
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun scripts/auth-watch.ts https://cubepals.com
