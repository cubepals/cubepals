name: Nightly

# Main's newest commit deployed to staging and taken through the staging check, then staging is
# stopped again. A commit that passes is tagged v<next>-nightly.<date>.<run> (scripts/versions.ts)
# and made a prerelease; production.ts deploys only such a commit.
on:
  schedule:
    - cron: '13 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run on staging at a time; a second waits rather than deploying under the first.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  nightly:
    name: "Nightly: deploy staging, check and tag"
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 75
    permissions:
      contents: write
      # The release's archive gets a signed provenance attestation (docs/build-provenance.md).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The schedule skips a commit that already has its nightly; by hand, it always runs.
      - name: Anything new since the last nightly
        id: new
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] && git tag --points-at HEAD | grep -q -- '-nightly\.'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "HEAD already has its nightly."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.new.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - if: steps.new.outputs.run == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.111
      # The release ships only `flyctl`; the scripts call it `fly`, as its installer names it.
      - if: steps.new.outputs.run == 'true'
        run: ln -s flyctl "$(dirname "$(command -v flyctl)")/fly" && fly version
      - if: steps.new.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Deploy this commit to staging
        if: steps.new.outputs.run == 'true'
        run: bun scripts/staging.ts up
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STAGING_STATE: ${{ secrets.STAGING_STATE }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_PRODUCTS: ${{ secrets.POLAR_PRODUCTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The web app's Worker: Workers Scripts, Workers Routes and R2 on cubepals.com's account.
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
          AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}
          STAGING_DEVELOPERS: ${{ secrets.STAGING_DEVELOPERS }}
          # Staging's database is on Fly; STAGING_DATABASE=supabase (a variable of this environment)
          # brings back the Supabase project that STAGING_DATABASE_URL names.
          STAGING_DATABASE: ${{ vars.STAGING_DATABASE }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      # The tag below needs this to pass: no nightly is made while staging's website is broken.
      - name: Ask staging for its pages
        if: steps.new.outputs.run == 'true'
        run: bun scripts/site-check.ts https://staging.cubepals.com 180
      - name: Staging check
        if: steps.new.outputs.run == 'true'
        run: bun scripts/staging-check.ts
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STAGING_STATE: ${{ secrets.STAGING_STATE }}
          STAGING_DATABASE: ${{ vars.STAGING_DATABASE }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      # Whatever happened above, nothing is left running or holding an address. A second try
      # covers a blip reaching Fly, which once left staging running (2026-10-08).
      - name: Stop staging
        if: always() && steps.new.outputs.run == 'true'
        run: bun scripts/staging.ts stop || (sleep 60 && bun scripts/staging.ts stop)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STAGING_STATE: ${{ secrets.STAGING_STATE }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      - name: Tag and release the nightly
        id: release
        if: steps.new.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          tag=$(bun scripts/versions.ts nightly "$RUN")
          git archive --format=tar.gz --prefix="cubepals-$tag/" -o "$RUNNER_TEMP/cubepals-$tag.tar.gz" "$GITHUB_SHA"
          gh release create "$tag" "$RUNNER_TEMP/cubepals-$tag.tar.gz" --target "$GITHUB_SHA" --prerelease --generate-notes --title "$tag"
          echo "archive=$RUNNER_TEMP/cubepals-$tag.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Attest the release's archive
        if: steps.release.outputs.archive != ''
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.release.outputs.archive }}
