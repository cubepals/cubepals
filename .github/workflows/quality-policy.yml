name: Quality policy

# The controller and its policy come from the base. Proposed files are read as Git blobs only:
# no dependency installation, imports, hooks, or scripts from the proposed tree are executed.
# Bootstrap and changes to this protected controller require an administrator policy update;
# scripts/quality/README.md describes the trust boundary and installation sequence.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:

permissions:
  contents: read

jobs:
  pending:
    name: Mark quality policy pending
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Clear any previous successful result for this head before checking it
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          [[ "$QUALITY_HEAD" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$QUALITY_HEAD" \
            --field state=pending --field context='Quality policy' \
            --field description='Trusted quality policy is being checked.' \
            --field target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  policy:
    name: Verify quality policy
    needs: pending
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Compare proposed Git objects with the trusted policy
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          QUALITY_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          [[ "$QUALITY_BASE" =~ ^[0-9a-f]{40}$ && "$QUALITY_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git -c core.hooksPath=/dev/null fetch --no-tags origin "$QUALITY_HEAD"
          node scripts/quality/policy.mjs --base "$QUALITY_BASE" --head "$QUALITY_HEAD"

  publish:
    name: Publish quality policy status
    needs: [pending, policy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # pull_request_target runs against the base SHA. Explicitly attach the required status to
      # the proposed head, in a job that checks out nothing and never executes proposed code.
      - name: Report the trusted controller's result on the proposed commit
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          [[ "$QUALITY_HEAD" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          description="Trusted quality policy did not pass."
          if [ "$POLICY_RESULT" = success ]; then
            state=success
            description="Trusted quality policy passed."
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$QUALITY_HEAD" \
            --field state="$state" --field context='Quality policy' \
            --field description="$description" \
            --field target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
