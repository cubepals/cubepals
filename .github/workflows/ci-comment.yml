name: CI comment

# One comment on each pull request with its CI run's results (scripts/ci-comment.ts): running while
# CI runs, then each part's result and every failed test. workflow_run gives the token write
# access on pull requests from forks too, so the job never checks out or runs their code: it runs
# the base branch's scripts and reads the run's JUnit reports as data. A push to main gets no
# comment. A failure here only warns: `check` in ci.yml judges the run, not this.
on:
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  pull-requests: write

# One job at a time for each CI run, so "running" never lands after its results. GitHub keeps one
# job pending in a group and cancels the one it replaces, so the `completed` event's job can be
# cancelled for a later event's; that job starts after the run is done and writes the results
# itself. A group per run, not per branch, so one run's events never cancel another run's.
concurrency:
  group: ci-comment-${{ github.event.workflow_run.id }}

jobs:
  comment:
    name: Report the checks on the pull request
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            packages/contracts/src
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # Each test group's report, in a directory of its artifact's name, once the run is done. The
      # run as it is now, not as the event saw it: a job that waited behind another can start after
      # the run is done, whatever event started it.
      - name: Download the test results
        id: results
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .status || true)
          if [ "$status" != completed ]; then exit 0; fi
          if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'junit-*' --dir "$RUNNER_TEMP/junit"; then
            echo "dir=$RUNNER_TEMP/junit" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The run's test results couldn't be downloaded."
          fi
      # Cubepals' own bot writes the comment where the repository has its app (CUBEPALS_APP_CLIENT_ID
      # and CUBEPALS_APP_PRIVATE_KEY); without them, or if it fails, github-actions[bot] does.
      - name: Cubepals' bot
        id: bot
        if: vars.CUBEPALS_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CUBEPALS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUBEPALS_APP_PRIVATE_KEY }}
      - name: Say how CI is going
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          COMMENT_AUTHOR: ${{ steps.bot.outputs.app-slug && format('{0}[bot]', steps.bot.outputs.app-slug) || 'github-actions[bot]' }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          JUNIT: ${{ steps.results.outputs.dir }}
        run: >-
          bun scripts/ci-comment.ts ||
          echo "::warning::The CI comment couldn't be written."
