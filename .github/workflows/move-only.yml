name: Move only

# A pull request titled `Move:` only moves code: scripts/check-move-only.ts proves it. A retitle or
# a body edit (where `## Not a move` declares exceptions) runs it again.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  move-only:
    if: startsWith(github.event.pull_request.title, 'Move:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # The body is untrusted text: it reaches the script through the environment, never the shell.
      - run: bun run check:move-only --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
