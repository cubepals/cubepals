name: Labels check

# A pull request carries exactly one kind/, at least one area/ and one size/ label before it
# merges (branch protection requires this check). labels.yml adds them within a minute or so of a
# push; this waits up to three minutes for them, and runs again when someone adds or removes a
# label. Labels added with labels.yml's token start no workflow, so that run re-runs this one when
# it failed first. A run for a commit the pull request has moved past ends at once, green: a newer
# push has its own run, and a cancelled one shows as a grey cross on a pull request that is fine.
# Bots' pull requests are held to it too: Dependabot's carry kind/deps from dependabot.yml and get
# the rest like any other.
#
# It checks out the base branch's tools/labels, not the pull request's, installs nothing and only
# reads labels, with a read-only token, so it is safe on pull requests from forks.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  # Required checks must report in the merge queue too. The labels were checked on the pull
  # request, so there every step is skipped and the check passes.
  merge_group:

permissions: {}

jobs:
  labels:
    name: Has a kind, an area and a size
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Superseded only when the pull request's head is a later commit than this run's; a lagging
      # answer from the API, or a force push, runs the check.
      - name: Whether this is still the newest push
        id: newest
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD...$current" --jq .status || true)
          if [ "$status" = ahead ]; then
            echo "::notice::The pull request has a newer push; its run checks the labels."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'pull_request' && steps.newest.outputs.stale != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/labels
          persist-credentials: false
      - if: github.event_name == 'pull_request' && steps.newest.outputs.stale != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - if: github.event_name == 'pull_request' && steps.newest.outputs.stale != 'true'
        run: bun tools/labels/cli.ts check "$NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
