name: Dependabot

# Dependabot's minor and patch group merges itself once `check` passes, as a security group would.
# Majors and actions wait for a person: they can break what a pull request's CI doesn't run, such
# as the nightly. The groups are in .github/dependabot.yml.
on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: contains(fromJSON('["bun", "bun-security"]'), steps.meta.outputs.dependency-group)
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "$PR"
