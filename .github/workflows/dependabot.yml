name: Dependabot

# Dependabot's minor and patch groups merge themselves once `check` passes, as a security group
# would. Majors and actions wait for a person: they can break what a pull request's CI doesn't
# run, such as the nightly. So does any update that moves the website's runtime (next, its adapter
# opennextjs/cloudflare, or wrangler), a security fix included: Next 16.4.0 passed CI and its
# Worker failed every request in production, so the runtime moves only after it has run on
# staging. The groups are in .github/dependabot.yml.
on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge Dependabot updates
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: contains(fromJSON('["bun", "bun-security"]'), steps.meta.outputs.dependency-group)
        env:
          PR: ${{ github.event.pull_request.html_url }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if tr ',' '\n' <<< "$NAMES" | tr -d ' ' | grep -qxE 'next|@opennextjs/cloudflare|wrangler'; then
            echo "This update moves the website's runtime, so it waits for a run on staging."
            exit 0
          fi
          gh pr merge --auto --squash "$PR"
