name: Bedrock E2E

# Bedrock players on staging, end to end (scripts/bedrock-check.ts). Bedrock is UDP, which a cloud
# session can't send and a GitHub runner can. It tests what staging runs now: the Nightly deploys
# staging, this does not. Started staging is stopped again at the end. The edge's Xbox sign-in check
# is off for the run, since its players are headless clients with no account, and on again after,
# whatever happened. Only people with write access see "Run workflow". It shares the Nightly's
# concurrency group: neither changes staging under the other.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  bedrock:
    name: "Bedrock E2E: join staging over UDP"
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.111
      # The release ships only `flyctl`; the scripts call it `fly`, as its installer names it.
      - run: ln -s flyctl "$(dirname "$(command -v flyctl)")/fly" && fly version
      - run: bun install --frozen-lockfile
      # The headless Bedrock client is outside the workspaces: it needs a native RakNet build.
      - run: bun install --frozen-lockfile
        working-directory: tools/bedrock-join
      - name: Start staging
        run: bun scripts/staging.ts start
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STAGING_STATE: ${{ secrets.STAGING_STATE }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          STAGING_DATABASE: ${{ vars.STAGING_DATABASE }}
      # Xbox sign-in off on the staging edge: it restarts, and Geyser with it. The setting goes back
      # in the step that always runs below, which is why it comes before anything that can fail.
      - name: Turn the edge's Xbox sign-in check off
        id: validation
        run: fly secrets set BEDROCK_VALIDATE_LOGIN=false -a bly-staging-edge
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Bedrock check
        shell: bash
        run: bun scripts/bedrock-check.ts | tee bedrock-check.log
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STAGING_STATE: ${{ secrets.STAGING_STATE }}
          STAGING_DATABASE: ${{ vars.STAGING_DATABASE }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: Table of steps
        if: always()
        run: |
          if [ -f bedrock-check.log ]; then
            { echo '```'; sed -n '/^  step /,$p' bedrock-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # A second try covers a blip reaching Fly, as the stop below has.
      - name: Turn the edge's Xbox sign-in check on
        if: always() && steps.validation.conclusion != 'skipped'
        run: |
          fly secrets set BEDROCK_VALIDATE_LOGIN=true -a bly-staging-edge ||
            (sleep 60 && fly secrets set BEDROCK_VALIDATE_LOGIN=true -a bly-staging-edge)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Whatever happened above, nothing is left running. A second try covers a blip reaching Fly.
      # The servers this run made were trashed by the check; one that a cancelled run left is
      # purged by the next staging check, which knows them by their create key.
      - name: Stop staging
        if: always()
        run: bun scripts/staging.ts stop || (sleep 60 && bun scripts/staging.ts stop)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STAGING_STATE: ${{ secrets.STAGING_STATE }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          STAGING_DATABASE: ${{ vars.STAGING_DATABASE }}
