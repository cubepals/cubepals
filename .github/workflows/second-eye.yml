name: Second eye

# A second reviewer for a sensitive pull request, run on the maintainer's Claude subscription
# (CLAUDE_CODE_OAUTH_TOKEN). It runs only when v0id-user asks: by adding the needs-second-eye
# label, by a comment with a line starting "@claude review", or with
# `gh workflow run second-eye.yml -f pr=<number>`. Anyone else's label, comment or re-run skips
# it, so nobody else can spend the subscription. What the reviewer looks for and how it answers
# is .github/second-eye.md, which is its whole prompt.
#
# One pass covers the whole pull request: the turns it may use grow with the number of changed
# files (TURNS_BASE plus TURNS_PER_FILE each, up to TURNS_MOST), and the answer has no cap on the
# findings. A later pass is given the findings of the earlier one, read from the data block the
# comment keeps, and settles each (fixed, gone or still open) before it looks for more.
#
# The jobs that can write never meet Claude. The review job holds read-only tokens: it checks out
# the commit this workflow came from (the default branch, or for a label or a push the pull
# request itself, which already wrote this file), saves the pull request's description and diff
# as data in .second-eye/, and runs Claude with no shell and no tool but reading files in the
# workspace. Its answer is JSON in a fixed shape. The comment job writes it as Cubepals' bot
# (github-actions[bot] without the app), editing its earlier review instead of adding one, and
# labels the pull request review/ai-merge or review/ai-fix-first.
#
# It follows the pull request: once it has been asked for (the pull request carries
# needs-second-eye, or a verdict label), each push v0id-user makes reviews the new head again. The
# mark job says first, at the top of the comment, that the review is for an older commit, and takes
# the verdict's label off until the new one lands. The review then waits QUIET_MINUTES for the
# pushes to stop: a run that finds a newer push has its own run ends green without reviewing, so
# one review covers a burst of fixes and none shows as cancelled. A draft's push only marks the
# review stale; the review runs when it is ready for review.
#
# A review starts in two ways only, and never because someone opened a pull request. It starts by
# itself on a same-repository pull request that v0id-user opened and that touches a sensitive path
# (scripts/second-eye-gate.ts lists them). And it starts when v0id-user asks, on any pull request.
# A push to a fork's pull request starts nothing, and a run by hand refuses a fork's; a label or a
# comment reviews a fork's pull request from the default branch, as it would any.
#
# The gate job sets one status, "Second eye gate", on every pull request's head for a ruleset to
# require: it passes at once when no sensitive path changed, and otherwise fails until a review
# has finished, saying that it waits for v0id-user to request one.
on:
  pull_request:
    types: [opened, reopened, labeled, synchronize, ready_for_review]
  # A fork's pull request, for its label and the gate only: its token can't write a status. Nothing
  # of the pull request is checked out or run.
  pull_request_target:
    types: [opened, reopened, labeled, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        type: number
        required: true
      force:
        description: Review again although the head already has its review
        type: boolean
        default: false

permissions: {}

jobs:
  # Which sensitive paths the pull request touches, and whether that starts a review by itself.
  # It reads the file list through the API and runs nothing of the pull request. A same-repository
  # pull request is seen by the pull_request event and a fork's by pull_request_target, so each is
  # seen once, with a token that can write the status.
  sensitive:
    name: Find the sensitive paths
    if: >-
      github.repository == 'cubepals/cubepals'
      && (
        (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'pull_request_target'
          && github.event.pull_request.head.repo.full_name != github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sensitive: ${{ steps.paths.outputs.sensitive }}
      auto: ${{ steps.paths.outputs.auto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            scripts
            .github
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Find the sensitive paths
        id: paths
        env:
          MODE: paths
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login || github.actor }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: bun scripts/second-eye-gate.ts

  # Asked for, by whom, and on which branch. Every job after it needs it, so an event it skips
  # (anyone else's comment, a push to a pull request nobody asked to review, anyone else's pull
  # request) runs nothing and cancels nothing, and the model is never reached.
  mark:
    name: Say a new review is coming
    needs: sensitive
    # A comment or a run by hand has no sensitive job, and a request must still start when that job
    # failed: only the automatic start reads its output, which a failed job leaves empty.
    if: >-
      !cancelled()
      && github.repository == 'cubepals/cubepals'
      && github.actor == 'v0id-user'
      && github.triggering_actor == 'v0id-user'
      && (
        (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (
            (github.event.action == 'labeled' && github.event.label.name == 'needs-second-eye')
            || (github.event.action != 'labeled'
              && (needs.sensitive.outputs.auto == 'true'
                || contains(github.event.pull_request.labels.*.name, 'needs-second-eye')
                || contains(github.event.pull_request.labels.*.name, 'review/ai-merge')
                || contains(github.event.pull_request.labels.*.name, 'review/ai-fix-first')))))
        || (github.event_name == 'pull_request_target'
          && github.event.pull_request.head.repo.full_name != github.repository
          && github.event.action == 'labeled'
          && github.event.label.name == 'needs-second-eye')
        || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.login == 'v0id-user'
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
          && (startsWith(github.event.comment.body, '@claude review')
            || contains(github.event.comment.body, fromJSON('"\n@claude review"'))))
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    outputs:
      # Whether this run reviews: not a draft's push or opening, which waits for ready_for_review,
      # and not a run by hand on a head that already has its review, unless forced.
      review: ${{ steps.decide.outputs.review }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            scripts
            .github
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Cubepals' bot
        id: bot
        if: vars.CUBEPALS_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CUBEPALS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUBEPALS_APP_PRIVATE_KEY }}
      - name: Decide whether to review
        id: decide
        env:
          DECIDE: 1
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          COMMENT_AUTHOR: ${{ steps.bot.outputs.app-slug && format('{0}[bot]', steps.bot.outputs.app-slug) || 'github-actions[bot]' }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FORCE: ${{ inputs.force }}
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: bun scripts/second-eye-comment.ts
      # Only a run that reviews, or a draft's push that makes the review stale, writes anything: a
      # skipped review never touches the comment or the labels.
      - name: Say a new review is coming
        if: steps.decide.outputs.notice != 'none'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          COMMENT_AUTHOR: ${{ steps.bot.outputs.app-slug && format('{0}[bot]', steps.bot.outputs.app-slug) || 'github-actions[bot]' }}
          NOTICE: ${{ steps.decide.outputs.notice }}
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: bun scripts/second-eye-comment.ts

  review:
    name: Review
    needs: mark
    # A job's implicit success() also fails on a skipped job further up the chain, and a comment or
    # a run by hand has no sensitive job: the status is asked for here, so the review still runs.
    if: >-
      !cancelled()
      && needs.mark.result == 'success'
      && needs.mark.outputs.review == 'true'
    runs-on: ubuntu-latest
    # The quiet window and the review.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      superseded: ${{ steps.newer.outputs.superseded || steps.after.outputs.superseded }}
      review: ${{ steps.claude.outputs.structured_output }}
      reviewed: ${{ steps.pull.outputs.reviewed }}
      previous: ${{ steps.pull.outputs.previous }}
      model: ${{ steps.model.outputs.model }}
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
    steps:
      # A push waits briefly for the pushes right after it (a burst of commits), and the job that
      # wakes to a newer push stands down (the next step). Five minutes catches a burst without
      # holding a ready pull request back. A label, a comment or a run by hand is someone asking
      # now, so it starts at once.
      - name: Wait for the pushes to stop
        if: github.event.action == 'synchronize'
        env:
          QUIET_MINUTES: 5
        run: sleep "${QUIET_MINUTES}m"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # The pull request as data for Claude to read: never fetched as a ref, checked out or run.
      - name: Read the pull request
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TURNS_BASE: 30
          TURNS_PER_FILE: 4
          TURNS_MOST: 150
        run: |
          mkdir .second-eye
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json number,title,body,files,isCrossRepository,headRefOid,additions,deletions,changedFiles > .second-eye/pr.json
          if [ "$EVENT" = workflow_dispatch ] && [ "$(jq .isCrossRepository .second-eye/pr.json)" = true ]; then
            echo "::error::#$PR is from a fork; review it with a comment instead."
            exit 1
          fi
          gh pr diff "$PR" -R "$GITHUB_REPOSITORY" > .second-eye/pr.diff
          echo "reviewed=$(jq -c '{sha: .headRefOid, files: .changedFiles, additions, deletions}' .second-eye/pr.json)" >> "$GITHUB_OUTPUT"
          echo "turns=$(jq --argjson base "$TURNS_BASE" --argjson per "$TURNS_PER_FILE" --argjson most "$TURNS_MOST" '[$base + $per * .changedFiles, $most] | min' .second-eye/pr.json)" >> "$GITHUB_OUTPUT"
          # The findings of the review before this one, from the data block its comment ends with,
          # cut down to the fields of a finding. A bot's comment only, and never run or trusted.
          encoded="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            | jq -r '[.[][] | select(.user.type == "Bot" and (.body | startswith("<!-- second-eye -->")))] | last | .body // ""' \
            | grep -o 'second-eye-data:[A-Za-z0-9+/=]*' | tail -n 1 | cut -d: -f2 || true)"
          if [ -n "$encoded" ] && printf '%s' "$encoded" | base64 -d \
            | jq -c '{sha: (.sha | tostring), findings: [.findings[]? | {severity, file, line, problem}]}' > .second-eye/previous.json; then
            echo "previous=$(cat .second-eye/previous.json)" >> "$GITHUB_OUTPUT"
            before="$(jq -r .sha .second-eye/previous.json)"
            head="$(jq -r .headRefOid .second-eye/pr.json)"
            if printf '%s' "$before" | grep -Eq '^[0-9a-f]{40}$' && [ "$before" != "$head" ]; then
              gh api -H 'Accept: application/vnd.github.diff' "repos/$GITHUB_REPOSITORY/compare/$before...$head" > .second-eye/since.diff || rm -f .second-eye/since.diff
            fi
          else
            rm -f .second-eye/previous.json
          fi
      # The review is for the commit this run began on. When the pull request has moved to a later
      # commit and the run that push started has a Review job that was not skipped (it waits, runs or
      # finished), that run reviews the new head, and this one ends green. A push nobody asked a
      # review for starts a run whose Review job is skipped, so the review goes on and says it is
      # of an older commit.
      - name: Whether a newer push has its own review
        id: newer
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ github.event.pull_request.head.sha }}
        run: |
          head=$(jq -r .headRefOid .second-eye/pr.json)
          if [ -n "$STARTED" ] && [ "$STARTED" != "$head" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$STARTED...$head" --jq .status || true)
            if [ "$status" = ahead ]; then
              for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/second-eye.yml/runs?head_sha=$head&event=pull_request&per_page=100" --jq '.workflow_runs[].id'); do
                reviews=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "Review" and .conclusion != "skipped")] | length')
                if [ "$reviews" -gt 0 ]; then
                  echo "::notice::A newer push has its own review."
                  echo "superseded=true" >> "$GITHUB_OUTPUT"
                  break
                fi
              done
            fi
          fi
      - name: Load the rules
        id: rules
        if: steps.newer.outputs.superseded != 'true'
        run: |
          delimiter="rules-$(openssl rand -hex 16)"
          { echo "prompt<<$delimiter"; cat .github/second-eye.md; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      # Claude may read files in the workspace and nothing else: no shell, no edits, no web, and
      # no path where a secret lives (the process's environment, the home directory's settings,
      # the runner's files, the git config the action writes its token into).
      - id: claude
        if: steps.newer.outputs.superseded != 'true'
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own read-only token, in place of the Claude app's; Claude has no tool to use it.
          github_token: ${{ github.token }}
          prompt: ${{ steps.rules.outputs.prompt }}
          claude_args: >-
            --max-turns ${{ steps.pull.outputs.turns }}
            --permission-mode dontAsk
            --allowedTools "Read(./**)"
            --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch,Read(./.git/**),Read(//proc/**),Read(//sys/**),Read(//dev/**),Read(//etc/**),Read(//root/**),Read(//tmp/**),Read(//var/**),Read(//run/**),Read(//opt/**),Read(~/.*),Read(~/.*/**),Read(//home/runner/work/_temp/**),Read(//home/runner/work/_actions/**),Read(//home/runner/runners/**),Read(//home/runner/actions-runner/**)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","files_reviewed","earlier","findings"],"properties":{"verdict":{"enum":["merge","fix first"]},"files_reviewed":{"type":"integer","minimum":0},"earlier":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["number","status","note"],"properties":{"number":{"type":"integer","minimum":1},"status":{"enum":["fixed","gone"]},"note":{"type":"string","maxLength":200}}}},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["severity","origin","file","line","problem","fix","why"],"properties":{"severity":{"enum":["high","medium","low"]},"origin":{"enum":["first","open","new","missed"]},"file":{"type":"string","maxLength":200},"line":{"type":"integer","minimum":1},"problem":{"type":"string","maxLength":300},"fix":{"type":"string","maxLength":300},"why":{"type":"string","maxLength":600}}}}}}'
      # The same question once the review is made: a push that landed while Claude read, or while
      # the quiet window of a push before it ran, has its own review, and this one must not land
      # over it.
      - name: Whether a newer push came during the review
        id: after
        if: steps.claude.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewed=$(jq -r .headRefOid .second-eye/pr.json)
          head=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$reviewed" != "$head" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$reviewed...$head" --jq .status || true)
            if [ "$status" = ahead ]; then
              for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/second-eye.yml/runs?head_sha=$head&event=pull_request&per_page=100" --jq '.workflow_runs[].id'); do
                reviews=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "Review" and .conclusion != "skipped")] | length')
                if [ "$reviews" -gt 0 ]; then
                  echo "::notice::A newer push has its own review."
                  echo "superseded=true" >> "$GITHUB_OUTPUT"
                  break
                fi
              done
            fi
          fi
      # The action hides Claude's output. This prints only how long it took, which tools were
      # refused and on what path, and on failure the result's error (a bad token reads "401 OAuth
      # access token is invalid"), each on one line so none is taken as a workflow command.
      - name: Report the run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result")] | last // {}
            | "Turns: \(.num_turns // 0), \((.duration_ms // 0) / 1000 | floor) s",
              (.permission_denials // [] | .[] | "Refused: \(.tool_name) \(.tool_input.file_path // .tool_input.path // .tool_input.pattern // "" | gsub("[\\r\\n]+"; " "))"),
              (select(.is_error == true) | "::error::\(.result // "no result" | gsub("[\\r\\n]+"; " ")) (\(.terminal_reason // .subtype // "unknown"), HTTP \(.api_error_status // "none"))")' \
            "$EXECUTION_FILE"
      # The model the run's first message names, for the comment; only the characters a model's
      # name has, so nothing else reaches it.
      - name: Name the model
        id: model
        if: steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          model="$(jq -r '[.[] | select(.type == "system" and .subtype == "init")][0].model // ""' "$EXECUTION_FILE" | tr -cd '[:alnum:]._-')"
          echo "model=$model" >> "$GITHUB_OUTPUT"

  comment:
    name: Comment
    needs: review
    # As for the review: asked for here because the sensitive job above it can be skipped.
    if: >-
      !cancelled()
      && needs.review.result == 'success'
      && needs.review.outputs.review != ''
      && needs.review.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # For github-actions[bot] when the Cubepals app isn't configured: the comment and the label.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            scripts
            .github
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # Cubepals' own bot writes the review where the repository has its app (CUBEPALS_APP_CLIENT_ID
      # and CUBEPALS_APP_PRIVATE_KEY); without them, or if it fails, github-actions[bot] does.
      - name: Cubepals' bot
        id: bot
        if: vars.CUBEPALS_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CUBEPALS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUBEPALS_APP_PRIVATE_KEY }}
      - name: Write the review
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          COMMENT_AUTHOR: ${{ steps.bot.outputs.app-slug && format('{0}[bot]', steps.bot.outputs.app-slug) || 'github-actions[bot]' }}
          REVIEW: ${{ needs.review.outputs.review }}
          REVIEWED: ${{ needs.review.outputs.reviewed }}
          PREVIOUS: ${{ needs.review.outputs.previous }}
          MODEL: ${{ needs.review.outputs.model }}
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: bun scripts/second-eye-comment.ts

  # A review that failed, or answered nothing, says so on the comment in place of "running". One
  # a newer push replaced says nothing: the newer run writes the comment.
  failed:
    name: Say the review didn't finish
    needs: [mark, review]
    if: >-
      always()
      && needs.mark.outputs.review == 'true'
      && needs.review.outputs.superseded != 'true'
      && (needs.review.result == 'failure'
        || (needs.review.result == 'success' && needs.review.outputs.review == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            scripts
            .github
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Cubepals' bot
        id: bot
        if: vars.CUBEPALS_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CUBEPALS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUBEPALS_APP_PRIVATE_KEY }}
      - name: Say the review didn't finish
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          COMMENT_AUTHOR: ${{ steps.bot.outputs.app-slug && format('{0}[bot]', steps.bot.outputs.app-slug) || 'github-actions[bot]' }}
          NOTICE: failed
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: bun scripts/second-eye-comment.ts

  # The status a ruleset requires. It runs after the others, whatever they did, and says what
  # became of the review: passed at once when no sensitive path changed, failed while a sensitive
  # change waits for v0id-user to request one, passed once the review has finished.
  gate:
    name: Set the second eye gate
    needs: [sensitive, mark, review, comment]
    # Dependabot's token is read-only and can't set a status, so its pull requests have none until
    # v0id-user asks for a review, which sets it from a comment or a run by hand.
    if: >-
      always()
      && github.actor != 'dependabot[bot]'
      && (needs.sensitive.result != 'skipped'
        || (contains(fromJSON('["issue_comment", "workflow_dispatch"]'), github.event_name)
          && needs.mark.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            scripts
            .github
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Set the second eye gate
        env:
          MODE: status
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SENSITIVE: ${{ needs.sensitive.outputs.sensitive }}
          MARK: ${{ needs.mark.result }}
          REVIEW: ${{ needs.review.result }}
          COMMENT: ${{ needs.comment.result }}
          SHA: ${{ fromJSON(needs.review.outputs.reviewed || '{}').sha || github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: bun scripts/second-eye-gate.ts
