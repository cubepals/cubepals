name: Isolated quality runner
on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      group:
        type: string
        default: all
      partition:
        required: true
        type: number
      full_quality:
        type: boolean
        default: false
      comparison_base:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  run:
    name: ${{ inputs.kind }} ${{ inputs.group }} / ${{ inputs.partition }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: blockly
          POSTGRES_PASSWORD: blockly
          POSTGRES_DB: blockly
        ports: ['5432:5432']
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U blockly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GROUP: ${{ inputs.group }}
      PARTITION: ${{ inputs.partition }}
      DATABASE_URL: postgres://blockly:blockly@127.0.0.1:5432/blockly
      NATS_TEST_URL: nats://127.0.0.1:4222
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_BUCKET: blockly-test
      PEBBLE_TEST_URL: https://127.0.0.1:14000/dir
      CHALLTESTSRV_TEST_URL: http://127.0.0.1:8055
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Mirrors refuse bursts when parallel jobs pull at once, so each pull retries. The Docker
      # runtime's tests run helpers on alpine and curl; pulled here, no test pulls them itself, and
      # tagged with the names the runtime asks for: nothing comes from Docker Hub, whose outages
      # failed runs. Alpine is Google's mirror of Docker Hub's, curl the curl project's own on Quay.
      - name: Pull the test images
        run: |
          for image in mirror.gcr.io/library/nats:2.15.0 ghcr.io/rustfs/rustfs:1.0.0 ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1 ghcr.io/letsencrypt/pebble:2.10.1 mirror.gcr.io/library/alpine:3.22 quay.io/curl/curl:8.22.0; do
            for wait in 2 5 10 20 40 0; do
              docker pull -q "$image" && break
              [ "$wait" = 0 ] && exit 1
              sleep "$wait"
            done
          done
          docker tag mirror.gcr.io/library/alpine:3.22 alpine:3.22
          docker tag quay.io/curl/curl:8.22.0 curlimages/curl:8.22.0
      # The edge's tests run a real mc-router: the one the edge's image is built with, copied out
      # of the image apps/edge/Dockerfile names.
      - name: Fetch mc-router
        run: |
          image=$(sed -n 's/^FROM \(ghcr\.io\/itzg\/mc-router[^ ]*\) AS router$/\1/p' apps/edge/Dockerfile)
          for wait in 2 5 10 20 40 0; do
            docker pull -q "$image" && break
            [ "$wait" = 0 ] && exit 1
            sleep "$wait"
          done
          docker create --name mc-router "$image"
          docker cp mc-router:/mc-router "$RUNNER_TEMP/mc-router"
          echo "MC_ROUTER_BIN=$RUNNER_TEMP/mc-router" >> "$GITHUB_ENV"
      - name: Start NATS
        run: docker run -d --name nats -p 4222:4222 mirror.gcr.io/library/nats:2.15.0 --user blockly-test --pass fm2_blockly_test
      - name: Start an S3 store
        run: >-
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=blockly-test
          -e RUSTFS_SECRET_KEY=blockly-test-secret ghcr.io/rustfs/rustfs:1.0.0
      # Let's Encrypt's test CA, validating DNS-01 against its own DNS test server.
      - name: Start Pebble and its DNS test server
        run: |
          docker network create acme
          docker run -d --name challtestsrv --network acme -p 8055:8055 \
            ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1 \
            -management :8055 -dnsserver :8053 -http01 "" -https01 "" -tlsalpn01 ""
          docker run -d --name pebble --network acme -p 14000:14000 -e PEBBLE_VA_NOSLEEP=1 \
            ghcr.io/letsencrypt/pebble:2.10.1 -dnsserver challtestsrv:8053
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # WebTransport's install fetches its binary from GitHub's releases, which refuse a burst of
      # downloads now and then, so the install retries as the image pulls do.
      - name: Install dependencies
        run: |
          for wait in 5 15 30 60 0; do
            bun install --frozen-lockfile && break
            [ "$wait" = 0 ] && exit 1
            sleep "$wait"
          done
      - run: bun run openapi:install
      - run: bun run quality:install
      - run: bun run labels:install
      - name: Create the test bucket
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null --aws-sigv4 aws:amz:auto:s3 --user blockly-test:blockly-test-secret \
              -X PUT http://127.0.0.1:9000/blockly-test && exit 0
            sleep 1
          done
          exit 1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        id: terraform_setup
        continue-on-error: true
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.terraform_setup.outcome == 'failure'
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - name: Check tooling and service readiness
        run: node scripts/quality/preflight.mjs
      - name: Identify the measured base and changed files
        id: quality
        env:
          QUALITY_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison_base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
          QUALITY_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/quality/prepare.mjs coverage/quality
      - name: Install the base checkout's pinned dependencies
        if: inputs.kind == 'native'
        env:
          BASE: ${{ steps.quality.outputs.base }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/quality-base" "$BASE"
          (cd "$RUNNER_TEMP/quality-base" && bun install --frozen-lockfile && bun run quality:install && bun run openapi:install && bun run labels:install)
          node scripts/quality/partition-plan.mjs "$GITHUB_WORKSPACE" "$BASE" coverage/quality/test-plan.json
      - name: Measure this partition on the unchanged base
        if: inputs.kind == 'native'
        run: |
          node scripts/quality/run-shard.mjs "$RUNNER_TEMP/quality-base" "$GROUP" "$GITHUB_WORKSPACE/coverage/quality/base" - coverage/quality/test-plan.json "$PARTITION"
      - name: Test this partition with branch coverage
        if: inputs.kind == 'native'
        run: |
          node scripts/quality/run-shard.mjs "$GITHUB_WORKSPACE" "$GROUP" "$GITHUB_WORKSPACE/coverage/quality/head" "$GITHUB_WORKSPACE/coverage/quality/base/manifests/$GROUP-$PARTITION.json" coverage/quality/test-plan.json "$PARTITION"
      - name: Keep the test results for the PR report
        if: ${{ !cancelled() && inputs.kind == 'native' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ inputs.group }}-${{ inputs.partition }}
          path: coverage/quality/head/${{ inputs.group }}-${{ inputs.partition }}.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep every native partition's evidence
        if: ${{ !cancelled() && inputs.kind == 'native' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-native-${{ inputs.group }}-${{ inputs.partition }}
          path: |
            coverage/quality/base/
            coverage/quality/head/
          if-no-files-found: error
          retention-days: 14
      - name: Obtain independently verified native evidence
        if: inputs.kind == 'mutation'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-quality
          path: coverage/quality
      - name: Test all assigned mutation subjects
        if: inputs.kind == 'mutation'
        env:
          QUALITY_EXPECTED_BASE: ${{ steps.quality.outputs.base }}
          QUALITY_EXPECTED_HEAD: ${{ github.sha }}
          FULL_QUALITY: ${{ github.event_name == 'schedule' || inputs.full_quality == true }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$FULL_QUALITY" = true ]; then args+=(--full); fi
          if [ "$EVENT_NAME" = schedule ]; then args+=(--rotation "$(( $(date -u +%u) - 1 ))"); fi
          for group in lifecycle providers worlds mods access web rest; do
            node scripts/quality/mutation-cli.mjs --base "$QUALITY_EXPECTED_BASE" --head "$QUALITY_EXPECTED_HEAD" --changed coverage/quality/changed.json --group "$group" --partition "$PARTITION" --output "coverage/quality/mutation/$PARTITION/$group" "${args[@]}"
          done
      - name: Concurrent wake contracts reject shared denial
        if: inputs.kind == 'native' && inputs.group == 'access' && inputs.partition == 0
        run: node scripts/quality/behavior-proof.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/coverage/quality/service-proof" services
      - name: Keep mandatory service contract proof
        if: ${{ !cancelled() && inputs.kind == 'native' && inputs.group == 'access' && inputs.partition == 0 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-service-proof
          path: coverage/quality/service-proof/
          if-no-files-found: error
          retention-days: 14
      - name: Keep every mutation partition's evidence
        if: ${{ !cancelled() && inputs.kind == 'mutation' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-mutation-${{ inputs.partition }}
          path: coverage/quality/mutation/
          if-no-files-found: error
          retention-days: 14
