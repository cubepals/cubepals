name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's check of a pull request on top of what is queued ahead of it; the jobs and
  # their names are the same, so `check` is the one answer there too.
  merge_group:
  workflow_call:
    inputs:
      comparison_base:
        description: Exact ancestor SHA for a representative runtime benchmark
        type: string
        default: ''
      full_quality:
        description: Run the legacy mutation audit
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Exact ancestor SHA for a representative runtime benchmark
        type: string
        default: ''
      full_quality:
        description: Run mutation testing across the complete source inventory
        type: boolean
        default: false

permissions:
  contents: read

# Required ruleset workflows must finish their evidence. Each main commit gets its own group so
# another push cannot replace a pending main run; PR revisions queue behind their running check.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: false

jobs:
  # Unrelated jobs may skip, but `check` still reports and verifies each classification.
  changes:
    name: Find what changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The queue tests everything: what a merge changes is what the commits ahead of it changed too.
      code: ${{ (inputs.full_quality == true || github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.code }}
      reporter: ${{ (inputs.full_quality == true || github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.reporter.outputs.reporter }}
      fleet: ${{ (inputs.full_quality == true || github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.fleet.outputs.fleet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every pull request commit has a verified signature
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/quality/check-signatures.mjs --pr "$PR_NUMBER"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'merge_group' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!brand/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/CODEOWNERS'
              - '!.github/pull_request_template.md'
              - '!.github/dependabot.yml'
      # Its own step: under `every` above, a file would have to match all of these at once.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: reporter
        if: github.event_name != 'merge_group' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            reporter:
              - 'apps/reporter/**'
              - '.github/workflows/ci.yml'
              - 'scripts/quality/reporter*'

      # Fleet's contracts, fixtures, dependency resolution and runtime setup all affect its live
      # evidence. Keep this conservative; web/edge/reporter-only source changes can skip it.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: fleet
        if: github.event_name != 'merge_group' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            fleet:
              - 'apps/control/**'
              - 'packages/**'
              - 'scripts/**'
              - 'tools/**'
              - '**/package.json'
              - '**/bun.lock'
              - '**/bun.lockb'
              - '**/package-lock.json'
              - '**/npm-shrinkwrap.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/bunfig.toml'
              - '**/tsconfig*.json'
              - '*.{js,cjs,mjs,ts,cts,mts,json,jsonc,toml,yml,yaml}'
              - '.node-version'
              - '.bun-version'
              - '.nvmrc'
              - '.tool-versions'
              - '.npmrc'
              - '.yarnrc*'
              - '.env*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/fleet.yml'

  fleet:
    needs: changes
    if: needs.changes.outputs.fleet == 'true'
    uses: ./.github/workflows/fleet.yml

  static:
    name: Lint, types and structure
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # The control plane runs on Node in its image; a few checks run there too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # WebTransport's install fetches its binary from GitHub's releases, which refuse a burst of
      # downloads now and then, so the install retries as the image pulls do.
      - name: Install dependencies
        run: |
          for wait in 5 15 30 60 0; do
            bun install --frozen-lockfile && break
            [ "$wait" = 0 ] && exit 1
            sleep "$wait"
          done
      - run: bun run openapi:install
      - run: bun run quality:install
      - run: bun run labels:install
      - name: API types match their pinned specs
        run: bun run openapi:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:boundaries
      - run: bun run check:structure
      - run: bun run check:deprecated
      - name: Quality gates reject missing evidence and policy tampering
        run: |
          node --test scripts/quality/*.test.mjs
          python3 scripts/quality/reporter_test.py
      - name: Real defects and superficial tests are rejected
        run: |
          node scripts/quality/behavior-proof.mjs
          node scripts/quality/mutation-selftest.mjs
      # A workflow GitHub can't parse fails without running and is easy to miss.
      - name: Workflows parse and their scripts pass shellcheck
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Keep executable quality proof evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-quality-proofs
          path: |
            coverage/behavior-proof/
            coverage/mutation-proof/
          if-no-files-found: error
          retention-days: 14
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        id: terraform_setup
        continue-on-error: true
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.terraform_setup.outcome == 'failure'
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - name: Terraform is formatted and valid against its providers
        run: |
          terraform fmt -check -recursive infra/terraform
          for tf_environment in staging production; do
            for tf_wait in 5 15 30 0; do
              terraform -chdir=infra/terraform/environments/$tf_environment init -backend=false -input=false && break
              [ "$tf_wait" = 0 ] && exit 1
              sleep "$tf_wait"
            done
            terraform -chdir=infra/terraform/environments/$tf_environment validate
          done
      # A plan of each environment against its example config, with stand-in credentials and no
      # state: a variable or secret the stack reads and an environment doesn't give fails here, not
      # at the next apply. Two changes that pass alone and break together fail in the merge queue.
      - name: Terraform plans for each environment
        run: bun scripts/terraform-plan.ts

  # The website as the Cloudflare Worker production runs: OpenNext's build, wrangler's bundle of the
  # Worker's entry, uploading nothing, then the built Worker started locally and asked for the
  # site's pages (scripts/worker-smoke.ts). A Next or adapter update that breaks any of these fails
  # here, not at the next deploy: Next 16.4.0 built and bundled, then threw on every request. The
  # values are stand-ins; deploys build with their own.
  worker:
    name: Web app builds as a Worker
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # WebTransport's install fetches its binary from GitHub's releases, which refuse a burst of
      # downloads now and then, so the install retries as the image pulls do.
      - name: Install dependencies
        run: |
          for wait in 5 15 30 60 0; do
            bun install --frozen-lockfile && break
            [ "$wait" = 0 ] && exit 1
            sleep "$wait"
          done
      - name: Build the Worker
        working-directory: apps/web
        env:
          API_UPSTREAM: http://127.0.0.1:4000
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run worker:build
      # OPEN_NEXT_DEPLOY keeps wrangler from handing the deploy back to OpenNext.
      - name: Bundle it as wrangler would deploy it
        working-directory: apps/web
        env:
          OPEN_NEXT_DEPLOY: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          ../../node_modules/.bin/wrangler deploy --dry-run --env= --outdir "$RUNNER_TEMP/worker"
          ../../node_modules/.bin/wrangler deploy --dry-run --env=staging --outdir "$RUNNER_TEMP/worker-staging"
      # Any page that isn't 2xx or 3xx, or an exception in the Worker's output, fails the job.
      - name: Run the built Worker and ask for its pages
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: bun scripts/worker-smoke.ts

  # The images deploys run, built from their Dockerfiles and started. The control plane's `--check`
  # loads every module its start does and exits before configuration or a database are needed; the
  # edge agent, given nothing, must get as far as asking for its first variable. A package an image
  # leaves out, such as a peer its install omits, fails here and not at the next deploy.
  images:
    name: Images build and start
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the control plane
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/control/Dockerfile
          tags: blockly-control:ci
          load: true
          cache-from: type=gha,scope=control
          cache-to: type=gha,mode=max,scope=control
      - name: The control plane loads every module it starts with
        run: timeout 120 docker run --rm blockly-control:ci node src/main.node.ts --check
      - name: Build the edge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/edge/Dockerfile
          tags: blockly-edge:ci
          load: true
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
      - name: The edge agent runs as far as its configuration
        run: |
          if out=$(timeout 60 docker run --rm blockly-edge:ci 2>&1); then
            echo "The edge agent started with no CONTROL_URL set."
            exit 1
          fi
          echo "$out"
          grep -q 'CONTROL_URL is required' <<<"$out"

  # The reporter plugin Cubepals places on Paper servers (apps/reporter): Java, with Gradle's own
  # wrapper. Built with JDK 21 for Java 17, the oldest Paper Cubepals offers runs on.
  reporter:
    name: Reporter plugin builds and passes its tests
    needs: changes
    if: needs.changes.outputs.reporter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Identify Java comparison
        id: quality
        env:
          QUALITY_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison_base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
          QUALITY_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/quality/prepare.mjs coverage/reporter
      - name: Measure Java coverage on base and proposed source
        env:
          BASE: ${{ steps.quality.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/quality-java-base" "$BASE"
          cp apps/reporter/build.gradle.kts "$RUNNER_TEMP/quality-java-base/apps/reporter/build.gradle.kts"
          (cd "$RUNNER_TEMP/quality-java-base/apps/reporter" && ./gradlew test jacocoTestReport --no-daemon --console=plain)
          (cd apps/reporter && ./gradlew build jacocoTestReport --no-daemon --console=plain)
          cp "$RUNNER_TEMP/quality-java-base/apps/reporter/build/reports/jacoco/test/jacocoTestReport.xml" coverage/reporter/base.xml
          cp apps/reporter/build/reports/jacoco/test/jacocoTestReport.xml coverage/reporter/head.xml
          python3 scripts/quality/reporter.py coverage --head coverage/reporter/head.xml --base coverage/reporter/base.xml --changed coverage/reporter/changed.json --base-sha "$BASE" --head-sha "$HEAD_SHA" --root .
      - name: Mutation checks cover changed classes and test dependencies
        env:
          FULL_QUALITY: ${{ github.event_name == 'schedule' || inputs.full_quality == true }}
          BASE: ${{ steps.quality.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          args=()
          if [ "$FULL_QUALITY" = true ]; then args+=(--full); fi
          classes=$(python3 scripts/quality/reporter.py scope --changed coverage/reporter/changed.json --base-sha "$BASE" --head-sha "$HEAD_SHA" --root . --output coverage/reporter/subjects.json "${args[@]}")
          if [ -n "$classes" ]; then
            (cd apps/reporter && ./gradlew pitest "-PqualityClasses=$classes" --no-daemon --console=plain)
            cp apps/reporter/build/reports/pitest/mutations.xml coverage/reporter/mutations.xml
            python3 scripts/quality/reporter.py mutation --report coverage/reporter/mutations.xml --subjects coverage/reporter/subjects.json --changed coverage/reporter/changed.json --base-sha "$BASE" --head-sha "$HEAD_SHA" --root . "${args[@]}"
          fi
      - name: Java gates reject real defects, weak tests and coverage loss
        run: python3 scripts/quality/reporter-proof.py
      - name: Keep Java quality evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporter-quality
          path: |
            coverage/reporter/
            coverage/reporter-proof/
          if-no-files-found: error
          retention-days: 14

  # Resolve cache provenance before any application tests execute. Every runner shares one
  # immutable hit/miss decision; cache transport or validation failures fall back to fresh tests.
  baseline:
    name: Resolve a trusted baseline
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      hit: ${{ steps.selected.outputs.hit }}
      key: ${{ steps.cache.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: bun run quality:install
      - name: Identify the exact baseline
        id: comparison
        env:
          QUALITY_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison_base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
          QUALITY_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/quality/prepare.mjs coverage/quality
      - name: Restore only a matching successful main-run artifact
        id: cache
        env:
          BASE: ${{ steps.comparison.outputs.base }}
          GH_TOKEN: ${{ github.token }}
          FULL_QUALITY: ${{ github.event_name == 'schedule' || inputs.full_quality == true }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/quality-base" "$BASE"
          node scripts/quality/baseline-cache.mjs restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/quality-base" coverage/quality/comparison.json coverage/quality/cached-base "$FULL_QUALITY"
      - name: Freeze the validated baseline for this run
        id: frozen
        continue-on-error: true
        if: steps.cache.outputs.hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-baseline
          path: coverage/quality/cached-base/
          if-no-files-found: error
          retention-days: 14

      - name: Choose the shared baseline mode
        id: selected
        env:
          RESTORED: ${{ steps.cache.outputs.hit }}
          UPLOADED: ${{ steps.frozen.outcome }}
        run: |
          if [ "$RESTORED" = true ] && [ "$UPLOADED" = success ]; then
            echo 'hit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
            echo 'Baseline measurements will run fresh.'
          fi

  # Each native partition has its own services and complete base/head evidence.
  test:
    name: Tests, ${{ matrix.quality }} / ${{ matrix.partition }}
    needs: [changes, baseline]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      max-parallel: ${{ (github.event_name == 'schedule' || inputs.full_quality == true) && 2 || 17 }}
      matrix:
        include:
          - quality: lifecycle
            partition: 0
          - quality: lifecycle
            partition: 1
          - quality: lifecycle
            partition: 2
          - quality: providers
            partition: 0
          - quality: providers
            partition: 1
          - quality: worlds
            partition: 0
          - quality: worlds
            partition: 1
          - quality: worlds
            partition: 2
          - quality: mods
            partition: 0
          - quality: access
            partition: 0
          - quality: access
            partition: 1
          - quality: access
            partition: 2
          - quality: web
            partition: 0
          - quality: rest
            partition: 0
          - quality: rest
            partition: 1
          - quality: rest
            partition: 2
          - quality: rest
            partition: 3
    uses: ./.github/workflows/quality-runner.yml
    with:
      kind: native
      group: ${{ matrix.quality }}
      partition: ${{ matrix.partition }}
      baseline_hit: ${{ needs.baseline.outputs.hit == 'true' }}
      comparison_base: ${{ inputs.comparison_base || '' }}

  mutation:
    name: Mutation runner ${{ matrix.partition }}
    needs: [changes, quality]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      max-parallel: ${{ (github.event_name == 'schedule' || inputs.full_quality == true) && 2 || 4 }}
      matrix:
        partition: [0, 1, 2, 3]
    uses: ./.github/workflows/quality-runner.yml
    with:
      kind: mutation
      partition: ${{ matrix.partition }}
      full_quality: ${{ inputs.full_quality == true }}
      comparison_base: ${{ inputs.comparison_base || '' }}

  # Percentages are computed from the union of all seven shards, never from an aggregate average.
  quality:
    name: Per-file test quality
    needs: [changes, test, baseline]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: bun install --frozen-lockfile
      - run: bun run quality:install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quality-native-*
          path: coverage/quality
          merge-multiple: true
      - name: Verify the comparison from Git independently of test artifacts
        id: comparison
        env:
          QUALITY_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison_base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
          QUALITY_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/quality/prepare.mjs coverage/quality/verified-comparison
      - name: Obtain the immutable validated baseline
        if: needs.baseline.outputs.hit == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-baseline
          path: coverage/quality/cached-base
      - name: Reassemble the exact native test inventory
        env:
          BASE: ${{ steps.comparison.outputs.base }}
          BASELINE_HIT: ${{ needs.baseline.outputs.hit }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/quality-base" "$BASE"
          args=()
          if [ "$BASELINE_HIT" = true ]; then args+=(coverage/quality/cached-base); fi
          node scripts/quality/coverage-partitions.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/quality-base" coverage/quality "$BASE" "${args[@]}"
      - name: Enforce every source file and all seven evidence shards
        run: |
          node scripts/quality/coverage.mjs merge --output coverage/quality/base.json --expected-shards 7 coverage/quality/merged/base/*.json
          node scripts/quality/coverage.mjs merge --output coverage/quality/head.json --expected-shards 7 coverage/quality/merged/head/*.json
          node scripts/quality/coverage.mjs check --report coverage/quality/head.json --base coverage/quality/base.json --changed coverage/quality/verified-comparison/changed.json --comparison coverage/quality/verified-comparison/comparison.json --root . --output coverage/quality/findings.json

      - name: Keep merged coverage and legacy deficit findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: per-file-coverage-findings
          path: |
            coverage/quality/base.json
            coverage/quality/head.json
            coverage/quality/findings.json
          if-no-files-found: error
          retention-days: 14

      - name: Keep verified native evidence for mutation runners
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-quality
          path: coverage/quality/merged/
          if-no-files-found: error
          retention-days: 14

  mutation_quality:
    name: Every mutation partition is complete
    needs: [changes, mutation]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: bun install --frozen-lockfile
      - run: bun run quality:install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quality-mutation-*
          path: coverage/quality/mutation
          merge-multiple: true
      - name: Verify the comparison independently
        env:
          QUALITY_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison_base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
          QUALITY_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/quality/prepare.mjs coverage/quality/verified-comparison
      - name: Verify every assigned file and independent mutant identity
        env:
          FULL_QUALITY: ${{ github.event_name == 'schedule' || inputs.full_quality == true }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$EVENT_NAME" = schedule ]; then args+=("$(( $(date -u +%u) - 1 ))"); fi
          node scripts/quality/mutation-partitions.mjs "$GITHUB_WORKSPACE" coverage/quality/mutation coverage/quality/verified-comparison/comparison.json "$FULL_QUALITY" "${args[@]}"
      - name: Keep verified mutation completeness
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-completeness
          path: |
            coverage/quality/mutation/verified-candidates.json
            coverage/quality/mutation/verified-summary.json
          if-no-files-found: error
          retention-days: 14

  # Only complete main CI runs can become cache producers. Consumers independently require
  # the server's successful conclusion, main branch, repository and exact workflow identity.
  # An explicit status function permits classified upstream skips after check has verified them.
  baseline_publish:
    name: Publish successful main baseline measurements
    needs: [changes, check]
    if: ${{ !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true' && inputs.full_quality != true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: bun run quality:install
      - name: Obtain verified measurements for optional publication
        id: measurements
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-quality
          path: coverage/quality/native
      - name: Identify the measured comparison
        if: steps.measurements.outcome == 'success'
        id: comparison
        env:
          QUALITY_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison_base || github.event.before || 'HEAD^' }}
        run: node scripts/quality/prepare.mjs coverage/quality
      - name: Validate both measured datasets before publication
        if: steps.measurements.outcome == 'success'
        id: cache
        env:
          BASE: ${{ steps.comparison.outputs.base }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/quality-base" "$BASE"
          node scripts/quality/baseline-cache.mjs publish "$GITHUB_WORKSPACE" "$RUNNER_TEMP/quality-base" coverage/quality/comparison.json coverage/quality/native coverage/quality/cache-publish
      - name: Publish the measured base
        continue-on-error: true
        if: steps.cache.outputs.base_key != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cache.outputs.base_key }}
          path: coverage/quality/cache-publish/base/
          if-no-files-found: error
          retention-days: 2
      - name: Publish the measured head for subsequent PRs
        continue-on-error: true
        if: steps.cache.outputs.head_key != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cache.outputs.head_key }}
          path: coverage/quality/cache-publish/head/
          if-no-files-found: error
          retention-days: 2

  # Every file says whose it is and under what license, in its own SPDX lines or in REUSE.toml.
  # It runs on every change, prose included: a new picture or document needs its line too.
  licenses:
    name: Every file has a license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==6.2.0 lint

  # The required aggregate rejects missing work and unexpected skips, including failed dependencies.
  check:
    needs: [changes, licenses, baseline, static, test, quality, mutation, mutation_quality, worker, images, reporter, fleet]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every required part succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/quality/aggregate.mjs
