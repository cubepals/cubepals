name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's check of a pull request on top of what is queued ahead of it; the jobs and
  # their names are the same, so `check` is the one answer there too.
  merge_group:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      full_quality:
        description: Run mutation testing across the complete source inventory
        type: boolean
        default: false

permissions:
  contents: read

# A newer PR revision supersedes its earlier evidence; main and scheduled runs finish normally.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A change to nothing but prose skips the rest. `check` still reports, so it can stay required.
  changes:
    name: Find what changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The queue tests everything: what a merge changes is what the commits ahead of it changed too.
      code: ${{ (github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.code }}
      reporter: ${{ (github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.reporter.outputs.reporter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'merge_group' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!brand/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/CODEOWNERS'
              - '!.github/pull_request_template.md'
              - '!.github/dependabot.yml'
      # Its own step: under `every` above, a file would have to match all of these at once.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: reporter
        if: github.event_name != 'merge_group' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            reporter:
              - 'apps/reporter/**'
              - '.github/workflows/ci.yml'
              - 'scripts/quality/reporter*'

  static:
    name: Lint, types and structure
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # The control plane runs on Node in its image; a few checks run there too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # WebTransport's install fetches its binary from GitHub's releases, which refuse a burst of
      # downloads now and then, so the install retries as the image pulls do.
      - name: Install dependencies
        run: |
          for wait in 5 15 30 60 0; do
            bun install --frozen-lockfile && break
            [ "$wait" = 0 ] && exit 1
            sleep "$wait"
          done
      - run: bun run openapi:install
      - run: bun run quality:install
      - name: API types match their pinned specs
        run: bun run openapi:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:boundaries
      - run: bun run check:structure
      - run: bun run check:deprecated
      - name: Quality gates reject missing evidence and policy tampering
        run: |
          node --test scripts/quality/*.test.mjs
          python3 scripts/quality/reporter_test.py
      - name: Real defects and superficial tests are rejected
        run: |
          node scripts/quality/behavior-proof.mjs
          node scripts/quality/mutation-selftest.mjs
      # A workflow GitHub can't parse fails without running and is easy to miss.
      - name: Workflows parse and their scripts pass shellcheck
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Keep executable quality proof evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-quality-proofs
          path: |
            coverage/behavior-proof/
            coverage/mutation-proof/
          if-no-files-found: error
          retention-days: 14
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - name: Terraform is formatted and valid against its providers
        run: |
          terraform fmt -check -recursive infra/terraform
          for env in staging production; do
            terraform -chdir=infra/terraform/environments/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/environments/$env validate
          done
      # A plan of each environment against its example config, with stand-in credentials and no
      # state: a variable or secret the stack reads and an environment doesn't give fails here, not
      # at the next apply. Two changes that pass alone and break together fail in the merge queue.
      - name: Terraform plans for each environment
        run: bun scripts/terraform-plan.ts

  # The website as the Cloudflare Worker production runs: OpenNext's build, wrangler's bundle of the
  # Worker's entry, uploading nothing, then the built Worker started locally and asked for the
  # site's pages (scripts/worker-smoke.ts). A Next or adapter update that breaks any of these fails
  # here, not at the next deploy: Next 16.4.0 built and bundled, then threw on every request. The
  # values are stand-ins; deploys build with their own.
  worker:
    name: Web app builds as a Worker
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # WebTransport's install fetches its binary from GitHub's releases, which refuse a burst of
      # downloads now and then, so the install retries as the image pulls do.
      - name: Install dependencies
        run: |
          for wait in 5 15 30 60 0; do
            bun install --frozen-lockfile && break
            [ "$wait" = 0 ] && exit 1
            sleep "$wait"
          done
      - name: Build the Worker
        working-directory: apps/web
        env:
          API_UPSTREAM: http://127.0.0.1:4000
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run worker:build
      # OPEN_NEXT_DEPLOY keeps wrangler from handing the deploy back to OpenNext.
      - name: Bundle it as wrangler would deploy it
        working-directory: apps/web
        env:
          OPEN_NEXT_DEPLOY: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          ../../node_modules/.bin/wrangler deploy --dry-run --env= --outdir "$RUNNER_TEMP/worker"
          ../../node_modules/.bin/wrangler deploy --dry-run --env=staging --outdir "$RUNNER_TEMP/worker-staging"
      # Any page that isn't 2xx or 3xx, or an exception in the Worker's output, fails the job.
      - name: Run the built Worker and ask for its pages
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: bun scripts/worker-smoke.ts

  # The images deploys run, built from their Dockerfiles and started. The control plane's `--check`
  # loads every module its start does and exits before configuration or a database are needed; the
  # edge agent, given nothing, must get as far as asking for its first variable. A package an image
  # leaves out, such as a peer its install omits, fails here and not at the next deploy.
  images:
    name: Images build and start
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the control plane
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/control/Dockerfile
          tags: blockly-control:ci
          load: true
          cache-from: type=gha,scope=control
          cache-to: type=gha,mode=max,scope=control
      - name: The control plane loads every module it starts with
        run: timeout 120 docker run --rm blockly-control:ci node src/main.node.ts --check
      - name: Build the edge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/edge/Dockerfile
          tags: blockly-edge:ci
          load: true
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
      - name: The edge agent runs as far as its configuration
        run: |
          if out=$(timeout 60 docker run --rm blockly-edge:ci 2>&1); then
            echo "The edge agent started with no CONTROL_URL set."
            exit 1
          fi
          echo "$out"
          grep -q 'CONTROL_URL is required' <<<"$out"

  # The reporter plugin Cubepals places on Paper servers (apps/reporter): Java, with Gradle's own
  # wrapper. Built with JDK 21 for Java 17, the oldest Paper Cubepals offers runs on.
  reporter:
    name: Reporter plugin builds and passes its tests
    needs: changes
    if: needs.changes.outputs.reporter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Identify Java comparison
        id: quality
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
          QUALITY_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/quality/prepare.mjs coverage/reporter
      - name: Measure Java coverage on base and proposed source
        env:
          BASE: ${{ steps.quality.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/quality-java-base" "$BASE"
          cp apps/reporter/build.gradle.kts "$RUNNER_TEMP/quality-java-base/apps/reporter/build.gradle.kts"
          (cd "$RUNNER_TEMP/quality-java-base/apps/reporter" && ./gradlew test jacocoTestReport --no-daemon --console=plain)
          (cd apps/reporter && ./gradlew build jacocoTestReport --no-daemon --console=plain)
          cp "$RUNNER_TEMP/quality-java-base/apps/reporter/build/reports/jacoco/test/jacocoTestReport.xml" coverage/reporter/base.xml
          cp apps/reporter/build/reports/jacoco/test/jacocoTestReport.xml coverage/reporter/head.xml
          python3 scripts/quality/reporter.py coverage --head coverage/reporter/head.xml --base coverage/reporter/base.xml --changed coverage/reporter/changed.json --base-sha "$BASE" --head-sha "$HEAD_SHA" --root .
      - name: Mutation checks cover changed classes and test dependencies
        env:
          FULL_QUALITY: ${{ github.event_name == 'schedule' || inputs.full_quality == true }}
          BASE: ${{ steps.quality.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          args=()
          if [ "$FULL_QUALITY" = true ]; then args+=(--full); fi
          classes=$(python3 scripts/quality/reporter.py scope --changed coverage/reporter/changed.json --base-sha "$BASE" --head-sha "$HEAD_SHA" --root . --output coverage/reporter/subjects.json "${args[@]}")
          if [ -n "$classes" ]; then
            (cd apps/reporter && ./gradlew pitest "-PqualityClasses=$classes" --no-daemon --console=plain)
            cp apps/reporter/build/reports/pitest/mutations.xml coverage/reporter/mutations.xml
            python3 scripts/quality/reporter.py mutation --report coverage/reporter/mutations.xml --subjects coverage/reporter/subjects.json --changed coverage/reporter/changed.json --base-sha "$BASE" --head-sha "$HEAD_SHA" --root . "${args[@]}"
          fi
      - name: Java gates reject real defects, weak tests and coverage loss
        run: python3 scripts/quality/reporter-proof.py
      - name: Keep Java quality evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporter-quality
          path: |
            coverage/reporter/
            coverage/reporter-proof/
          if-no-files-found: error
          retention-days: 14

  # The suite spends most of its time waiting on the job queue's half-second poll, test after test,
  # so the existing domain groups run on separate machines, each with its own services.
  test:
    name: Tests, ${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Grouped by what they test, near even in time (main's run on 2026-10-09: 50 to 160 seconds each,
      # the web app's far less).
      matrix:
        include:
          - group: Server lifecycle
            quality: lifecycle
          - group: Machine providers
            quality: providers
          - group: Backups, worlds and versions
            quality: worlds
          - group: Mods, packs and listings
            quality: mods
          - group: Web app, edge and scripts
            quality: web
          # Every test no group above names, so a new one is never left out.
          - group: Accounts, billing and the rest of the control plane
            quality: rest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: blockly
          POSTGRES_PASSWORD: blockly
          POSTGRES_DB: blockly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blockly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://blockly:blockly@127.0.0.1:5432/blockly
      NATS_TEST_URL: nats://127.0.0.1:4222
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_BUCKET: blockly-test
      PEBBLE_TEST_URL: https://127.0.0.1:14000/dir
      CHALLTESTSRV_TEST_URL: http://127.0.0.1:8055
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Mirrors refuse bursts when parallel jobs pull at once, so each pull retries. The Docker
      # runtime's tests run helpers on alpine and curl; pulled here, no test pulls them itself, and
      # tagged with the names the runtime asks for: nothing comes from Docker Hub, whose outages
      # failed runs. Alpine is Google's mirror of Docker Hub's, curl the curl project's own on Quay.
      - name: Pull the test images
        run: |
          for image in mirror.gcr.io/library/nats:2.15.0 ghcr.io/rustfs/rustfs:1.0.0 ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1 ghcr.io/letsencrypt/pebble:2.10.1 mirror.gcr.io/library/alpine:3.22 quay.io/curl/curl:8.22.0; do
            for wait in 2 5 10 20 40 0; do
              docker pull -q "$image" && break
              [ "$wait" = 0 ] && exit 1
              sleep "$wait"
            done
          done
          docker tag mirror.gcr.io/library/alpine:3.22 alpine:3.22
          docker tag quay.io/curl/curl:8.22.0 curlimages/curl:8.22.0
      # The edge's tests run a real mc-router: the one the edge's image is built with, copied out
      # of the image apps/edge/Dockerfile names.
      - name: Fetch mc-router
        run: |
          image=$(sed -n 's/^FROM \(ghcr\.io\/itzg\/mc-router[^ ]*\) AS router$/\1/p' apps/edge/Dockerfile)
          for wait in 2 5 10 20 40 0; do
            docker pull -q "$image" && break
            [ "$wait" = 0 ] && exit 1
            sleep "$wait"
          done
          docker create --name mc-router "$image"
          docker cp mc-router:/mc-router "$RUNNER_TEMP/mc-router"
          echo "MC_ROUTER_BIN=$RUNNER_TEMP/mc-router" >> "$GITHUB_ENV"
      - name: Start NATS
        run: docker run -d --name nats -p 4222:4222 mirror.gcr.io/library/nats:2.15.0 --user blockly-test --pass fm2_blockly_test
      - name: Start an S3 store
        run: >-
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=blockly-test
          -e RUSTFS_SECRET_KEY=blockly-test-secret ghcr.io/rustfs/rustfs:1.0.0
      # Let's Encrypt's test CA, validating DNS-01 against its own DNS test server.
      - name: Start Pebble and its DNS test server
        run: |
          docker network create acme
          docker run -d --name challtestsrv --network acme -p 8055:8055 \
            ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1 \
            -management :8055 -dnsserver :8053 -http01 "" -https01 "" -tlsalpn01 ""
          docker run -d --name pebble --network acme -p 14000:14000 -e PEBBLE_VA_NOSLEEP=1 \
            ghcr.io/letsencrypt/pebble:2.10.1 -dnsserver challtestsrv:8053
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # WebTransport's install fetches its binary from GitHub's releases, which refuse a burst of
      # downloads now and then, so the install retries as the image pulls do.
      - name: Install dependencies
        run: |
          for wait in 5 15 30 60 0; do
            bun install --frozen-lockfile && break
            [ "$wait" = 0 ] && exit 1
            sleep "$wait"
          done
      - run: bun run openapi:install
      - run: bun run quality:install
      - name: Create the test bucket
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null --aws-sigv4 aws:amz:auto:s3 --user blockly-test:blockly-test-secret \
              -X PUT http://127.0.0.1:9000/blockly-test && exit 0
            sleep 1
          done
          exit 1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - name: Identify the measured base and changed files
        id: quality
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
          QUALITY_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/quality/prepare.mjs coverage/quality
      - name: Measure the unchanged base with the same test group
        env:
          BASE: ${{ steps.quality.outputs.base }}
          GROUP: ${{ matrix.quality }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/quality-base" "$BASE"
          (cd "$RUNNER_TEMP/quality-base" && bun install --frozen-lockfile && bun run openapi:install)
          node scripts/quality/run-shard.mjs "$RUNNER_TEMP/quality-base" "$GROUP" "$GITHUB_WORKSPACE/coverage/quality/base"
      - name: Test ${{ matrix.group }} with branch coverage
        env:
          GROUP: ${{ matrix.quality }}
        run: |
          node scripts/quality/run-shard.mjs "$GITHUB_WORKSPACE" "$GROUP" "$GITHUB_WORKSPACE/coverage/quality/head" "$GITHUB_WORKSPACE/coverage/quality/base/manifests/$GROUP.json"
          cp "coverage/quality/head/$GROUP.xml" "$RUNNER_TEMP/junit.xml"
      - name: Tests kill defects in affected source files
        env:
          GROUP: ${{ matrix.quality }}
          QUALITY_EXPECTED_BASE: ${{ steps.quality.outputs.base }}
          QUALITY_EXPECTED_HEAD: ${{ github.sha }}
          FULL_QUALITY: ${{ github.event_name == 'schedule' || inputs.full_quality == true }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$FULL_QUALITY" = true ]; then args+=(--full); fi
          if [ "$EVENT_NAME" = schedule ]; then args+=(--rotation "$(( $(date -u +%u) - 1 ))"); fi
          node scripts/quality/mutation-cli.mjs --base "$QUALITY_EXPECTED_BASE" --head "$QUALITY_EXPECTED_HEAD" --changed coverage/quality/changed.json --group "$GROUP" --output "coverage/quality/mutation/$GROUP" "${args[@]}"
      - name: Keep mandatory quality evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ matrix.quality }}
          path: coverage/quality/
          if-no-files-found: error
          retention-days: 14
      # Each test's result, for the pull request's comment (ci-comment.yml). It never fails the job.
      - name: Keep the test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.group }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # Percentages are computed from the union of all six shards, never from an aggregate average.
  quality:
    name: Per-file test quality
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: bun install --frozen-lockfile
      - run: bun run quality:install
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: quality-*
          path: coverage/quality
          merge-multiple: true
      - name: Enforce every source file and all six evidence shards
        run: |
          node scripts/quality/coverage.mjs merge --output coverage/quality/base.json --expected-shards 6 coverage/quality/base/*.json
          node scripts/quality/coverage.mjs merge --output coverage/quality/head.json --expected-shards 6 coverage/quality/head/*.json
          node scripts/quality/coverage.mjs check --report coverage/quality/head.json --base coverage/quality/base.json --changed coverage/quality/changed.json --root . --output coverage/quality/findings.json

      - name: Keep merged coverage and legacy deficit findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: per-file-coverage-findings
          path: |
            coverage/quality/base.json
            coverage/quality/head.json
            coverage/quality/findings.json
          if-no-files-found: error
          retention-days: 14

  # Every file says whose it is and under what license, in its own SPDX lines or in REUSE.toml.
  # It runs on every change, prose included: a new picture or document needs its line too.
  licenses:
    name: Every file has a license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==6.2.0 lint

  # The required aggregate rejects missing work and unexpected skips, including failed dependencies.
  check:
    needs: [changes, licenses, static, test, quality, worker, images, reporter]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every required part succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/quality/aggregate.mjs
