name: PR title

# Pull requests are squash-merged, so the title becomes the commit on main: it says the change in
# 50 characters or fewer (scripts/check-subject.ts, which the commit-msg hook runs too). A retitle
# runs it again. The title and body name nobody by accident either (scripts/check-mentions.ts), since
# the body becomes the commit's and commits turn any at-sign name into a mention. Dependabot's and
# other bots' pull requests are theirs to write.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Title fits in 50 characters
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # The title is untrusted text: it reaches the script through the environment, never the shell.
      - run: bun run scripts/check-subject.ts --title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - name: Mentions nobody
        run: bun run scripts/check-mentions.ts --pr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
