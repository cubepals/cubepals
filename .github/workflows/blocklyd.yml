name: blocklyd

# The paths are blocklyd, the image that builds it, and what the fleet e2e runs beyond the fleet
# directory: @blockly/db, the runtime port, its test database, the S3 store, and the control
# plane's package.json, which pins @peculiar/x509 (the fleet CA's certificates). Both lists match.
on:
  push:
    branches: [main]
    paths:
      - 'apps/blocklyd/**'
      - 'apps/control/src/infra/fleet/**'
      - 'apps/control/Dockerfile'
      - 'apps/control/package.json'
      - 'apps/control/src/app/ports/**'
      - 'apps/control/src/infra/s3/**'
      - 'apps/control/src/testing/fleet.ts'
      - 'packages/db/**'
      - '.github/workflows/blocklyd.yml'
      - 'scripts/check-structure.ts'
      - 'scripts/structure-baseline.json'
  pull_request:
    paths:
      - 'apps/blocklyd/**'
      - 'apps/control/src/infra/fleet/**'
      - 'apps/control/Dockerfile'
      - 'apps/control/package.json'
      - 'apps/control/src/app/ports/**'
      - 'apps/control/src/infra/s3/**'
      - 'apps/control/src/testing/fleet.ts'
      - 'packages/db/**'
      - '.github/workflows/blocklyd.yml'
      - 'scripts/check-structure.ts'
      - 'scripts/structure-baseline.json'
  # Weekly, so supply-chain sees a new RustSec advisory against a dependency in a quiet week too;
  # and on demand.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.94.1

defaults:
  run:
    working-directory: apps/blocklyd

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup override set "$RUST_VERSION"
      # Keyed on the toolchain too: a new rustc can't reuse the old one's artifacts, and an exact
      # key hit never saves, so without it a Rust bump would rebuild everything on every run until
      # Cargo.lock changed. A Cargo.lock change starts from the last cache of the same Rust.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/blocklyd/target
          key: blocklyd-check-${{ env.RUST_VERSION }}-${{ hashFiles('apps/blocklyd/Cargo.lock') }}
          restore-keys: blocklyd-check-${{ env.RUST_VERSION }}-
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Clippy's complexity lints, held to scripts/structure-baseline.json rather than denied.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun ../../scripts/check-structure.ts --rust
      # As the runner's own user, not root: data goes to the test's user (tests/support). Every
      # test binary runs even after one fails, so a failure can't hide the others.
      - run: cargo test --locked --no-fail-fast
      # Against the runner's own Docker daemon: hardening, limits, the OOM killer, isolation,
      # restarts. They chown data directories, so Cargo's runner starts the test binary as root;
      # Cargo itself, and so target/, stays the runner's.
      - name: Docker integration tests
        run: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=sudo cargo test --locked --test docker -- --ignored --test-threads 2

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup override set "$RUST_VERSION"
      # The release's own binary, not a build from source on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # Advisories (RustSec), licenses, banned crates and sources: deny.toml.
      - run: cargo deny --locked check

  fleet-e2e:
    # The control plane's fleet runtime against this blocklyd, for real: enrollment over mutual
    # TLS, placement, snapshots, restores, a daemon killed and back, a node held lost
    # (apps/control/src/infra/fleet/fleet-runtime.e2e.test.ts).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blockly
          POSTGRES_PASSWORD: blockly
          POSTGRES_DB: blockly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blockly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://blockly:blockly@127.0.0.1:5432/blockly
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      # blocklyd hands data directories to the workloads' user, so it runs as root.
      BLOCKLYD_SUDO: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup override set "$RUST_VERSION"
      # As check's: the toolchain is in the key.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/blocklyd/target
          key: blocklyd-e2e-${{ env.RUST_VERSION }}-${{ hashFiles('apps/blocklyd/Cargo.lock') }}
          restore-keys: blocklyd-e2e-${{ env.RUST_VERSION }}-
      - run: cargo build --locked
      - name: Start an S3 store
        run: >-
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=blockly-test
          -e RUSTFS_SECRET_KEY=blockly-test-secret rustfs/rustfs:1.0.0 /data
      - run: docker pull -q alpine:3.22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # The node endpoint runs on Node, as in production.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test apps/control/src/infra/fleet/fleet-runtime.e2e.test.ts
        working-directory: .
        env:
          BLOCKLYD_BIN: ${{ github.workspace }}/apps/blocklyd/target/debug/blocklyd

  release:
    # The binary hosts run: static (musl), so it needs nothing from the host but a kernel. Built by
    # the control plane image's own blocklyd stage, which is what FLEET_BLOCKLYD_BIN serves, so CI
    # checks the bytes hosts get rather than a second recipe.
    runs-on: ubuntu-24.04
    needs: [check]
    steps:
      - uses: actions/checkout@v7
      - name: apps/control/Dockerfile, blocklyd stage
        working-directory: .
        run: docker build -f apps/control/Dockerfile --target blocklyd -t blocklyd-release .
      - name: Static, and how big
        run: |
          bin=target/release/blocklyd
          mkdir -p target/release
          id=$(docker create blocklyd-release)
          docker cp "$id:/src/target/release/blocklyd" "$bin"
          docker rm "$id" > /dev/null
          file "$bin" | grep -q 'static' || { file "$bin"; exit 1; }
          "$bin" --version
          ls -l "$bin"
          sha256sum "$bin" | tee "$bin.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: blocklyd-x86_64-linux-musl
          path: |
            apps/blocklyd/target/release/blocklyd
            apps/blocklyd/target/release/blocklyd.sha256
          if-no-files-found: error
