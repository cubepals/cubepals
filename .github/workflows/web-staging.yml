name: Website on staging

# blockly-web-staging, the website alone (scripts/staging-website.ts). Each push to main goes live
# at staging.cubepals.com; each pull request from this repository gets a preview version at
# pr-<n>-blockly-web-staging.<subdomain>.workers.dev, named in one comment on the pull request.
# The nightly still deploys the whole of staging. Neither starts staging's machines, and neither
# does a preview's traffic (control.toml has auto_start_machines off): while staging is stopped,
# whatever a page asks the control plane fails.
#
# The staging environment deploys from main only, so previews use their own environment, preview,
# holding CLOUDFLARE_WORKERS_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Without them the preview is
# skipped. Dependabot's pull requests never get them.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push replaces an older one's build: on main, and on each pull request.
concurrency:
  group: web-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy the website to staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun scripts/staging-website.ts deploy
        env:
          # Workers Scripts, Workers Routes and R2 on cubepals.com's account; the DNS token finds it.
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  preview:
    name: Preview the website on staging
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Whether this environment can upload
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_WORKERS_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No preview: the preview environment has no CLOUDFLARE_WORKERS_API_TOKEN or CLOUDFLARE_ACCOUNT_ID."
          fi
      - if: steps.ready.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - if: steps.ready.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - if: steps.ready.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Build and upload the preview
        id: upload
        if: steps.ready.outputs.run == 'true'
        env:
          PULL: ${{ github.event.pull_request.number }}
        run: bun scripts/staging-website.ts preview "$PULL"
      - name: Name it on the pull request
        if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          marker='<!-- web-staging-preview -->'
          body="${marker}
          **Preview:** ${URL} (from ${SHA:0:8})

          It runs against staging's control plane, which answers only while staging is started (\`bun scripts/staging.ts start\`)."
          existing=$(gh api "repos/${REPO}/issues/${PULL}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --silent -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$body"
          else
            gh api --silent -X POST "repos/${REPO}/issues/${PULL}/comments" -f body="$body"
          fi
