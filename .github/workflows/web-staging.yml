name: Website on staging

# blockly-web-staging, the website alone (scripts/staging-website.ts). Each push to main goes live
# at staging.cubepals.com; each pull request from this repository gets a preview version at
# pr-<n>-blockly-web-staging.<subdomain>.workers.dev, named in one comment on the pull request.
# The nightly still deploys the whole of staging. Neither starts staging's machines, and neither
# does a preview's traffic (control.toml has auto_start_machines off): while staging is stopped,
# whatever a page asks the control plane fails.
#
# The staging environment deploys from main only, so previews use their own environment, preview,
# holding CLOUDFLARE_WORKERS_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Without them the preview is
# skipped. Dependabot's pull requests never get them.
#
# A preview takes world uploads too: the preview environment's STAGING_BUCKET_* secrets (staging's
# world bucket, kept there by `staging.ts up`) let scripts/preview-uploads.ts name each open pull
# request's preview in the bucket's CORS rules, which take no wildcard. A preview is added once it
# is up and removed when its pull request closes; a sweep each day and on each push to main keeps
# exactly the open ones.
#
# The comment and the CORS tooling run from the base branch's copy of scripts/, never the pull
# request's, which may predate them. Neither can turn a pull request red: a failure there warns.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

# A newer push replaces an older one's build: on main, and on each pull request. The daily sweep
# has its own group, so it never cancels a deploy.
concurrency:
  group: web-staging-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'sweep') || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy the website to staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun scripts/staging-website.ts deploy
        env:
          # Workers Scripts, Workers Routes and R2 on cubepals.com's account; the DNS token finds it.
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  preview:
    name: Preview the website on staging
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REPO: ${{ github.repository }}
      PULL: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Whether this environment can upload
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_WORKERS_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No preview: the preview environment has no CLOUDFLARE_WORKERS_API_TOKEN or CLOUDFLARE_ACCOUNT_ID."
          fi
      - if: steps.ready.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # The base branch's scripts/, for the comment and the CORS rules: a branch made before them
      # doesn't have them. Its packages resolve from the pull request's install, one level up.
      - name: Check out the base branch's scripts
        id: tools
        if: steps.ready.outputs.run == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .preview-tools
          sparse-checkout: scripts
          persist-credentials: false
      - if: steps.ready.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # Cubepals' own bot writes the comment where the repository has its app (CUBEPALS_APP_CLIENT_ID
      # and CUBEPALS_APP_PRIVATE_KEY); without them, or if it fails, github-actions[bot] does.
      - name: Cubepals' bot
        id: bot
        if: steps.ready.outputs.run == 'true' && vars.CUBEPALS_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CUBEPALS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUBEPALS_APP_PRIVATE_KEY }}
      # One comment on the pull request (scripts/preview-comment.ts), edited at each step.
      - name: Say it is building
        if: steps.ready.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          COMMENT_AUTHOR: ${{ steps.bot.outputs.app-slug && format('{0}[bot]', steps.bot.outputs.app-slug) || 'github-actions[bot]' }}
        run: >-
          bun .preview-tools/scripts/preview-comment.ts building ||
          echo "::warning::The preview comment couldn't say it is building."
      - if: steps.ready.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Build and upload the preview
        id: upload
        if: steps.ready.outputs.run == 'true'
        run: bun scripts/staging-website.ts preview "$PULL"
      # Ready only with an address. A cancelled run says nothing: the newer push's run says it.
      - name: Say how it went
        if: ${{ !cancelled() && steps.ready.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          COMMENT_AUTHOR: ${{ steps.bot.outputs.app-slug && format('{0}[bot]', steps.bot.outputs.app-slug) || 'github-actions[bot]' }}
          URL: ${{ steps.upload.outputs.url }}
          VERSION: ${{ steps.upload.outputs.version }}
        run: >-
          bun .preview-tools/scripts/preview-comment.ts "$([ -n "$URL" ] && echo ready || echo failed)" ||
          echo "::warning::The preview comment couldn't say how the preview went."
      - name: Let the preview upload worlds
        if: ${{ !cancelled() && steps.upload.outputs.url != '' }}
        env:
          URL: ${{ steps.upload.outputs.url }}
          STAGING_BUCKET_NAME: ${{ secrets.STAGING_BUCKET_NAME }}
          STAGING_BUCKET_ENDPOINT: ${{ secrets.STAGING_BUCKET_ENDPOINT }}
          STAGING_BUCKET_REGION: ${{ secrets.STAGING_BUCKET_REGION }}
          STAGING_BUCKET_ACCESS_KEY_ID: ${{ secrets.STAGING_BUCKET_ACCESS_KEY_ID }}
          STAGING_BUCKET_SECRET_ACCESS_KEY: ${{ secrets.STAGING_BUCKET_SECRET_ACCESS_KEY }}
        run: >-
          bun .preview-tools/scripts/preview-uploads.ts add "$URL" ||
          echo "::warning::The preview can't take world uploads: its address isn't in the bucket's CORS rules."

  # The bucket's CORS rules without closed pull requests' previews: one on its closing, all of them
  # each day and on each push to main. From main's own scripts: a closing pull request's tree may
  # predate them.
  origins:
    name: Keep the previews' world uploads to open pull requests
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      STAGING_BUCKET_NAME: ${{ secrets.STAGING_BUCKET_NAME }}
      STAGING_BUCKET_ENDPOINT: ${{ secrets.STAGING_BUCKET_ENDPOINT }}
      STAGING_BUCKET_REGION: ${{ secrets.STAGING_BUCKET_REGION }}
      STAGING_BUCKET_ACCESS_KEY_ID: ${{ secrets.STAGING_BUCKET_ACCESS_KEY_ID }}
      STAGING_BUCKET_SECRET_ACCESS_KEY: ${{ secrets.STAGING_BUCKET_SECRET_ACCESS_KEY }}
      CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PULL: ${{ github.event.pull_request.number }}
    steps:
      - name: Whether this environment holds the bucket
        id: ready
        run: |
          if [ -n "$STAGING_BUCKET_NAME" ] && [ -n "$STAGING_BUCKET_SECRET_ACCESS_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CORS rules to keep: the preview environment has no STAGING_BUCKET_* secrets."
          fi
      - if: steps.ready.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - if: steps.ready.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - if: steps.ready.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Forget the closed pull request's preview
        if: steps.ready.outputs.run == 'true' && github.event_name == 'pull_request'
        run: >-
          bun scripts/preview-uploads.ts remove "$PULL" ||
          echo "::warning::The closed preview's address is still in the bucket's CORS rules; the next sweep takes it."
      - name: Keep exactly the open pull requests' previews
        if: steps.ready.outputs.run == 'true' && github.event_name != 'pull_request'
        run: >-
          bun scripts/preview-uploads.ts sweep ||
          echo "::warning::The sweep of the bucket's CORS rules failed; the next one tries again."
