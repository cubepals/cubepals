name: Deploy production

# Production deployed from GitHub's machine, so no deploy depends on one person's disk
# (docs/production.md § Deploy from GitHub). `apply` takes a nightly that passed on staging through
# `bun scripts/production.ts apply`; `ship now` takes the road main's guard finds for main's newest
# commit (§ Routes): nothing for prose and tests alone, otherwise a nightly of it, which starts
# `apply` for itself once it passes; the rollbacks put back what the last deploy changed. The
# values are production.env and config.auto.tfvars.json, taken from the encrypted bundle in the
# private records repository with the age key this environment holds; nothing else of it is opened.
#
# What runs is decided by main, not by what is deployed: scripts/production-guard.ts, from main at
# the commit it is on when the run starts, refuses an old run started again, a nightly that isn't
# on main or is older than production's settings need, and a Terraform plan that would move the
# play names' wildcard or give the Fly apps a setting of Terraform's own. The age key is
# PRODUCTION_AGE_KEY: a workflow from before the guard asks for another name, gets nothing, and
# can't open the values.
on:
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        type: choice
        options:
          - apply
          - ship now
          - rollback
          - rollback website
          - rollback fly
        default: apply
      version:
        description: The nightly to deploy (v…-nightly.…); empty takes the newest. Only for apply.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # The hot path, by the road main's newest commit takes from what production runs
  # (scripts/production-route.ts, from main's guard):
  # - prose and tests alone deploy nothing, and the run says so;
  # - the website alone waits until its commit is proved (CI passed and a preview answered, on it
  #   or on a pull request head with its tree), then the deploy job below deploys the website alone;
  # - everything else goes through staging now, rather than tonight: a nightly of main's newest
  #   commit, which starts this workflow's `apply` when it passes.
  # It opens nothing of production's.
  ship-now:
    name: "Production: ship now"
    if: inputs.command == 'ship now'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
      checks: read
      statuses: read
      pull-requests: read
    outputs:
      route: ${{ steps.route.outputs.route }}
      commit: ${{ steps.route.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Main's guard, and the road main's newest commit takes
        id: route
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          main=$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')
          git worktree add --quiet --detach "$RUNNER_TEMP/guard" "$main"
          bun "$RUNNER_TEMP/guard/scripts/production-guard.ts" route
      - name: Nothing to deploy
        if: steps.route.outputs.route == 'none'
        env:
          COMMIT: ${{ steps.route.outputs.commit }}
        run: |
          echo "Since what production runs, main changed only prose and tests: nothing to deploy for ${COMMIT:0:8}." | tee -a "$GITHUB_STEP_SUMMARY"
      # Proved at once when the merged pull request was up to date with main; otherwise once main's
      # CI and staging's website deploy have run on the commit, about fifteen minutes.
      - name: The website's commit is proved
        if: steps.route.outputs.route == 'website'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.route.outputs.commit }}
        run: |
          for _ in $(seq 1 70); do
            bun "$RUNNER_TEMP/guard/scripts/production-guard.ts" proven "$COMMIT" && exit 0
            sleep 30
          done
          echo "::error::${COMMIT:0:8} wasn't proved in 35 minutes: look at main's CI and Website on staging."
          exit 1
      - name: A nightly of main's newest commit, and production once it passes
        if: steps.route.outputs.route != 'none' && steps.route.outputs.route != 'website'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run nightly.yml --repo "$GITHUB_REPOSITORY" --ref main -f production=true
          echo "Started a nightly of main's newest commit; once it passes on staging, it starts Deploy production's apply for its tag." >> "$GITHUB_STEP_SUMMARY"

  # Every other command, and ship now's website route: the website alone, the commit ship now named.
  deploy:
    name: "Production: ${{ inputs.command == 'ship now' && 'website' || inputs.command }}"
    needs: ship-now
    if: >-
      !cancelled() && (inputs.command != 'ship now'
        || (needs.ship-now.result == 'success' && needs.ship-now.outputs.route == 'website'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    # One deploy at a time; a second waits rather than deploying under the first.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # DEPLOY_GITHUB_TOKEN pushes the `production` branch (workflows included), makes the release,
      # sets the Database dump workflow's secrets and reads the private records.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # Main's guard, in a checkout of its own that stays as it is for the whole run. It needs no
      # install: only node's modules and the files beside it.
      - name: Main's guard, and the commit to deploy
        id: guard
        env:
          COMMAND: ${{ inputs.command == 'ship now' && 'website' || inputs.command }}
          VERSION: ${{ inputs.command == 'ship now' && needs.ship-now.outputs.commit || inputs.version }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')
          git worktree add --quiet --detach "$RUNNER_TEMP/guard" "$main"
          bun "$RUNNER_TEMP/guard/scripts/production-guard.ts" run "$COMMAND" "$VERSION"
      - name: The commit to deploy
        env:
          COMMIT: ${{ steps.guard.outputs.commit }}
        run: git checkout --quiet --detach "$COMMIT" && git log -1 --format='%H %s'
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.111
      # The release ships only `flyctl`; the scripts call it `fly`, as its installer names it.
      - run: ln -s flyctl "$(dirname "$(command -v flyctl)")/fly" && fly version
      - name: Terraform and age
        run: |
          curl -fsSL -o "$RUNNER_TEMP/terraform.zip" https://releases.hashicorp.com/terraform/1.17.0/terraform_1.17.0_linux_amd64.zip
          echo "c168cab7c637a8769fdb90089ddd19de701bc6ff8aca64dc2e2185fe46f59f67  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          sudo unzip -oq "$RUNNER_TEMP/terraform.zip" terraform -d /usr/local/bin
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          terraform version && age --version
      - run: bun install --frozen-lockfile
      - name: Production's values, from the private records
        env:
          AGE_SECRET_KEY: ${{ secrets.PRODUCTION_AGE_KEY }}
          RECORDS_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
        run: |
          umask 077
          records="$RUNNER_TEMP/records"
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:$RECORDS_TOKEN@github.com/cubepals/cubepals-internal" "$records"
          git -C "$records" sparse-checkout set ops/secrets
          printf '%s\n' "$AGE_SECRET_KEY" > "$RUNNER_TEMP/age.key"
          AGE_KEY_FILE="$RUNNER_TEMP/age.key" sh "$records/ops/secrets/secrets-pack.sh" unpack \
            "$records/ops/secrets/cubepals-secrets.tar.age" . \
            local/production/production.env \
            infra/terraform/environments/production/config.auto.tfvars.json
          rm -rf "$RUNNER_TEMP/age.key" "$records"
      - name: The nightly fits production's settings
        if: inputs.command == 'apply'
        run: bun "$RUNNER_TEMP/guard/scripts/production-guard.ts" fits "$(git rev-parse HEAD)"
      # Terraform shows its plan, main's guard reviews it, and apply asks; starting this workflow is
      # the yes, to that plan file alone. The Database dump workflow keeps the secrets it has:
      # changing an environment takes administration rights the token doesn't need for anything else.
      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
          COMMAND: ${{ inputs.command == 'ship now' && 'website' || inputs.command }}
          PRODUCTION_GUARD: ${{ runner.temp }}/guard/scripts/production-guard.ts
        run: |
          if [ "$COMMAND" = apply ]; then
            echo yes | bun scripts/production.ts apply --keep-dump-secrets
          elif [ "$COMMAND" = website ]; then
            # The website alone: no Terraform and no Fly deploy (docs/production.md § Routes).
            bun scripts/production.ts web
          else
            # shellcheck disable=SC2086 # "rollback website" is the command and its argument.
            bun scripts/production.ts $COMMAND
          fi
      - name: Ask production for its pages and its API
        run: bun scripts/site-check.ts https://cubepals.com 180 --api
      - name: Leave no value behind
        if: always()
        run: rm -f local/production/production.env local/production/backend.hcl infra/terraform/environments/production/config.auto.tfvars.json infra/terraform/environments/production/production.tfplan
